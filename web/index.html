<meta charset="utf-8">
<title>KBO 볼배합 탐색기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 필터 레일(좌) + 분석 영역(우). 분석 영역은 스트라이크존 / 구종 구성표 / 카운트별 볼배합 순. 좁으면 한 열. */
:root {
  --bg: #f3f6f3;
  --surface: #ffffff;
  --ink: #15201a;
  --muted: #5a665f;
  --faint: #8b958f;
  --line: #dbe2dc;
  --accent: #1d6a48;
  --accent-soft: #e3efe8;
  --zone: #15201a;
  --pt-ff: #e34948; --pt-ft: #eb6834; --pt-fc: #eda100; --pt-sl: #2a78d6;
  --pt-sw: #6250d6; --pt-cu: #008300; --pt-ch: #1baf7a; --pt-fo: #e87ba4; --pt-etc: #8a918c;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #151d19; --ink: #e8eee9; --muted: #9ba69f; --faint: #6c7770;
    --line: #29342e; --accent: #62c08f; --accent-soft: #1c2e25; --zone: #e8eee9;
    --pt-ff: #e66767; --pt-ft: #d95926; --pt-fc: #c98500; --pt-sl: #3987e5;
    --pt-sw: #9085e9; --pt-cu: #008300; --pt-ch: #199e70; --pt-fo: #d55181; --pt-etc: #7d857f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #151d19; --ink: #e8eee9; --muted: #9ba69f; --faint: #6c7770;
  --line: #29342e; --accent: #62c08f; --accent-soft: #1c2e25; --zone: #e8eee9;
  --pt-ff: #e66767; --pt-ft: #d95926; --pt-fc: #c98500; --pt-sl: #3987e5;
  --pt-sw: #9085e9; --pt-cu: #008300; --pt-ch: #199e70; --pt-fo: #d55181; --pt-etc: #7d857f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: 0.01em; margin: 0; line-height: 1.1; text-wrap: balance; }
h1 small { font-family: var(--font-data); font-size: 13px; color: var(--muted); letter-spacing: 0; margin-left: 10px; }
.source { color: var(--muted); font-size: 12px; }

.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.filters { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 860px) { .filters { position: static; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); }
select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 8px; width: 100%; min-width: 0;
}
select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; font: inherit; font-size: 13px; padding: 5px 0; border: 0; background: var(--bg); color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.reset { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; }

main { display: grid; gap: 20px; min-width: 0; }
.statline { display: flex; flex-wrap: wrap; gap: 6px 28px; align-items: baseline; }
.statline .who { font-size: 22px; font-weight: 600; }
.statline .who span { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.stat { display: grid; }
.stat b { font-family: var(--font-data); font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat i { font-style: normal; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.panel .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.row3 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 1060px) { .row3 { grid-template-columns: minmax(0, 1fr); } }
.phead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; }
.phead .seg { min-width: 0; }
.phead .seg button { padding: 4px 10px; font-size: 12px; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; }
.canvas-box { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; }
.canvas-box canvas { width: 100%; height: 100%; display: block; }
.mini { margin-top: 10px; }
.play { display: flex; gap: 6px; align-items: stretch; }
.playbtn { font: inherit; font-size: 12px; font-weight: 600; color: var(--surface); background: var(--accent); border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
.playbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tun-base { min-width: 140px; }
#tuntable tbody tr { cursor: pointer; }
#tuntable tbody tr[aria-selected="true"] td { background: var(--accent-soft); }
#tuntable tbody tr:hover td { background: var(--bg); }
.stackcol { display: grid; gap: 20px; align-content: start; min-width: 0; }
.row2 { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 20px; }
@media (max-width: 1060px) { .row2 { grid-template-columns: minmax(0, 1fr); } }

.zone-box { position: relative; width: 100%; max-width: 380px; aspect-ratio: 5 / 5.4; margin: 0 auto; }
.zone-box canvas { width: 100%; height: 100%; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; }
.chip[aria-pressed="false"] { color: var(--faint); }
.chip[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--faint); }
.chip em { font-style: normal; font-family: var(--font-data); color: var(--muted); font-size: 11px; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: right; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--line); font-family: var(--font-data); font-size: 13px; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; font-family: var(--font-body); }
td .tname { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
td .tname i { width: 10px; height: 10px; border-radius: 50%; }
.bar { display: inline-block; vertical-align: middle; height: 6px; border-radius: 3px; background: var(--faint); margin-right: 8px; opacity: 0.55; }
tr:last-child td { border-bottom: 0; }
tr.total td { font-weight: 600; border-top: 1px solid var(--line); }

.counts { display: grid; gap: 4px; }
.crow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; gap: 10px; align-items: center; }
.crow .lab { font-family: var(--font-data); font-size: 13px; }
.crow .lab small { color: var(--muted); font-size: 11px; }
.crow .n { font-family: var(--font-data); font-size: 12px; color: var(--muted); text-align: right; }
.stack { display: flex; gap: 2px; height: 22px; }
.stack .seg2 { height: 100%; min-width: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-data); font-size: 11px; color: #fff; overflow: hidden; cursor: default; }
.stack .seg2:first-child { border-radius: 4px 0 0 4px; }
.stack .seg2:last-child { border-radius: 0 4px 4px 0; }
.stack .seg2:only-child { border-radius: 4px; }
.stack.empty { background: var(--bg); border-radius: 4px; }
.cgroup { font-size: 11px; color: var(--faint); letter-spacing: 0.06em; margin-top: 8px; }
.cgroup:first-child { margin-top: 0; }

.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); max-width: 240px; }
.tip b { font-weight: 600; }
.tip .m { font-family: var(--font-data); color: var(--muted); }

.state { padding: 40px 16px; text-align: center; color: var(--muted); }
.note { color: var(--muted); font-size: 12px; max-width: 70ch; }
@media (prefers-reduced-motion: no-preference) { .stack .seg2 { transition: flex-grow 0.25s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>KBO 볼배합 탐색기<small id="season"></small></h1>
    <div class="source" id="source">네이버 스포츠 문자중계 투구 추적 데이터</div>
  </header>

  <div class="layout">
    <aside class="filters" aria-label="필터">
      <div class="field"><label for="f-team">팀</label><select id="f-team"></select></div>
      <div class="field"><label for="f-pitcher">투수</label><select id="f-pitcher"></select></div>
      <div class="field"><label id="l-stance">타자 타석</label>
        <div class="seg" id="f-stance" role="group" aria-labelledby="l-stance">
          <button type="button" data-v="all" aria-pressed="true">전체</button>
          <button type="button" data-v="L" aria-pressed="false">좌타</button>
          <button type="button" data-v="R" aria-pressed="false">우타</button>
        </div>
      </div>
      <div class="field"><label for="f-count">카운트</label><select id="f-count"></select></div>
      <div class="field"><label id="l-scope">투구 범위</label>
        <div class="seg" id="f-scope" role="group" aria-labelledby="l-scope">
          <button type="button" data-v="all" aria-pressed="true">모든 공</button>
          <button type="button" data-v="last" aria-pressed="false">결정구</button>
        </div>
      </div>
      <div class="field"><label for="f-pa">타석 결과</label>
        <select id="f-pa">
          <option value="all">전체</option>
          <option value="so">삼진</option>
          <option value="bb">볼넷·사구</option>
          <option value="hit">안타</option>
          <option value="xbh">장타 (2루타·3루타·홈런)</option>
          <option value="hr">홈런</option>
          <option value="out">범타 (땅볼·플라이·직선타·병살)</option>
          <option value="gb">땅볼·병살</option>
          <option value="fb">플라이·직선타</option>
        </select>
      </div>
      <div class="field"><label for="f-runner">주자</label>
        <select id="f-runner">
          <option value="all">전체</option>
          <option value="none">주자 없음</option>
          <option value="on">주자 있음</option>
          <option value="risp">득점권 (2·3루)</option>
          <option value="1b">1루만</option>
          <option value="full">만루</option>
        </select>
      </div>
      <div class="field"><label id="l-outs">아웃</label>
        <div class="seg" id="f-outs" role="group" aria-labelledby="l-outs">
          <button type="button" data-v="all" aria-pressed="true">전체</button>
          <button type="button" data-v="0" aria-pressed="false">0</button>
          <button type="button" data-v="1" aria-pressed="false">1</button>
          <button type="button" data-v="2" aria-pressed="false">2</button>
        </div>
      </div>
      <div class="field"><label for="f-score">점수 상황 (투수팀 기준)</label>
        <select id="f-score">
          <option value="all">전체</option>
          <option value="close">접전 (±2점 이내)</option>
          <option value="lead">리드</option>
          <option value="tie">동점</option>
          <option value="trail">열세</option>
        </select>
      </div>
      <div class="field"><label for="f-month">기간</label><select id="f-month"></select></div>
      <div class="field"><label for="f-round">경기 구분</label>
        <select id="f-round">
          <option value="all">전체</option>
          <option value="reg">정규시즌</option>
          <option value="post">포스트시즌</option>
        </select>
      </div>
      <button type="button" class="reset" id="reset">조건 초기화</button>
    </aside>

    <main id="main">
      <div class="state" id="loading">투구 데이터를 불러오는 중…</div>
    </main>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<script>
(() => {
"use strict";
const TYPE_VAR = { "직구": "--pt-ff", "투심": "--pt-ft", "커터": "--pt-fc", "슬라이더": "--pt-sl", "스위퍼": "--pt-sw", "커브": "--pt-cu", "체인지업": "--pt-ch", "포크": "--pt-fo" };
const PA_GROUPS = {
  so: ["삼진"], bb: ["볼넷", "고의4구", "사구"], hit: ["1루타", "2루타", "3루타", "홈런"], xbh: ["2루타", "3루타", "홈런"], hr: ["홈런"],
  out: ["땅볼", "플라이", "라인드라이브", "병살타"], gb: ["땅볼", "병살타"], fb: ["플라이", "라인드라이브"],
};
const RESULT_LABEL = { B: "볼", T: "루킹 스트라이크", S: "헛스윙", F: "파울", H: "인플레이", W: "번트 파울", V: "번트 헛스윙" };
const COUNTS = [];
for (let b = 0; b <= 3; b++) for (let s = 0; s <= 2; s++) COUNTS.push([b, s]);
const COUNT_GROUPS = {
  first: { label: "초구 (0-0)", test: (b, s) => b === 0 && s === 0 },
  ahead: { label: "투수 유리 (0-1, 0-2, 1-2)", test: (b, s) => s > b && s > 0 },
  behind: { label: "타자 유리 (1-0, 2-0, 3-0, 2-1, 3-1)", test: (b, s) => b > s },
  even: { label: "동카운트 (1-1, 2-2)", test: (b, s) => b === s && b > 0 },
  two: { label: "2스트라이크", test: (b, s) => s === 2 },
  full: { label: "풀카운트 (3-2)", test: (b, s) => b === 3 && s === 2 },
};

const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("ko-KR");
const pct = (a, b) => (b ? (100 * a / b) : 0);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let D, N, P, B, T, V, X, Z, S, DT, R, MX, MZ, MONTH, pitchCount;
let colors = [];
const state = { team: "all", pitcher: "all", stance: "all", count: "all", runner: "all", outs: "all", score: "all", month: "all", round: "all", scope: "all", pa: "all", hidden: new Set() };
let sel = new Uint32Array(0);

function readColors() {
  const cs = getComputedStyle(document.documentElement);
  colors = D.types.map((t) => cs.getPropertyValue(TYPE_VAR[t] || "--pt-etc").trim());
}

function decode(data) {
  D = data; N = data.meta.count;
  const c = data.cols;
  P = Uint32Array.from(c.p); B = Uint32Array.from(c.b); T = Uint8Array.from(c.t);
  V = Uint16Array.from(c.v, (v) => v ?? 0);
  X = Int16Array.from(c.x, (v) => v ?? -32768); Z = Int16Array.from(c.z, (v) => v ?? -32768);
  S = Uint16Array.from(c.s); DT = Uint16Array.from(c.d);
  R = Int16Array.from(c.r, (v) => v ?? -1);  // 타석 결과*2 + 결정구, 없으면 -1
  MX = Int16Array.from(c.mx, (v) => v ?? -32768); MZ = Int16Array.from(c.mz, (v) => v ?? -32768);
  const months = [...new Set(data.dates.map((d) => d.slice(0, 7)))];
  const monthIdx = data.dates.map((d) => months.indexOf(d.slice(0, 7)));
  MONTH = { list: months, of: Uint8Array.from(DT, (d) => monthIdx[d]) };
  pitchCount = new Uint32Array(data.pitchers.length);
  for (let i = 0; i < N; i++) pitchCount[P[i]]++;
}

const balls = (s) => s & 3, strikes = (s) => (s >> 2) & 3, outs = (s) => (s >> 4) & 3;
const bases = (s) => (s >> 6) & 7, lefty = (s) => (s >> 9) & 1, result = (s) => (s >> 10) & 15, post = (s) => (s >> 14) & 1;

function filter() {
  const out = new Uint32Array(N);
  let k = 0;
  const teamIdx = state.team === "all" ? -1 : +state.team;
  const pit = state.pitcher === "all" ? -1 : +state.pitcher;
  const st = state.stance === "all" ? -1 : (state.stance === "L" ? 1 : 0);
  const cnt = state.count;
  const grp = COUNT_GROUPS[cnt];
  const single = cnt.includes("-") ? cnt.split("-").map(Number) : null;
  const o = state.outs === "all" ? -1 : +state.outs;
  const mo = state.month === "all" ? -1 : +state.month;
  const rd = state.round;
  const sc = state.score;
  const pTeam = D.pitchers.map((p) => p[1]);
  const diff = D.cols.sd;  // 점수차는 null이 있어 원본 배열 그대로 사용
  const lastOnly = state.scope === "last";
  const paSet = state.pa === "all" ? null : new Set(PA_GROUPS[state.pa].map((x) => D.pa_results.indexOf(x)));
  for (let i = 0; i < N; i++) {
    const s = S[i];
    if (pit >= 0) { if (P[i] !== pit) continue; }
    else if (teamIdx >= 0 && pTeam[P[i]] !== teamIdx) continue;
    if (st >= 0 && lefty(s) !== st) continue;
    if (o >= 0 && outs(s) !== o) continue;
    if (mo >= 0 && MONTH.of[i] !== mo) continue;
    if (lastOnly && (R[i] < 0 || !(R[i] & 1))) continue;
    if (paSet && (R[i] < 0 || !paSet.has(R[i] >> 1))) continue;
    if (rd === "reg" && post(s)) continue;
    if (rd === "post" && !post(s)) continue;
    if (cnt !== "all") {
      const b = balls(s), k2 = strikes(s);
      if (single ? (b !== single[0] || k2 !== single[1]) : !grp.test(b, k2)) continue;
    }
    if (state.runner !== "all") {
      const bs = bases(s);
      if (state.runner === "none" && bs !== 0) continue;
      if (state.runner === "on" && bs === 0) continue;
      if (state.runner === "risp" && (bs & 6) === 0) continue;
      if (state.runner === "1b" && bs !== 1) continue;
      if (state.runner === "full" && bs !== 7) continue;
    }
    if (sc !== "all" && diff) {
      const d = diff[i];
      if (d === null) continue;
      if (sc === "close" && Math.abs(d) > 2) continue;
      if (sc === "lead" && d <= 0) continue;
      if (sc === "tie" && d !== 0) continue;
      if (sc === "trail" && d >= 0) continue;
    }
    out[k++] = i;
  }
  sel = out.subarray(0, k);
}

/* ---------- 필터 UI ---------- */
function fillTeams() {
  const opts = [`<option value="all">전체 구단</option>`].concat(

}

/* ---------- 집계 ---------- */
function aggregate() {
  const nt = D.types.length;
  const by = Array.from({ length: nt }, () => ({ n: 0, vSum: 0, vN: 0, vMax: 0, strike: 0, swing: 0, whiff: 0 }));
  const byCount = COUNTS.map(() => new Uint32Array(nt));
  const fin = Array.from({ length: nt }, () => new Uint32Array(D.pa_results.length));
  for (const i of sel) {
    const t = T[i], s = S[i], a = by[t];
    a.n++;
    if (V[i]) { a.vSum += V[i]; a.vN++; if (V[i] > a.vMax) a.vMax = V[i]; }
    const r = D.results[result(s)];
    if (r && r !== "B") a.strike++;
    if (r === "S" || r === "F" || r === "H" || r === "W" || r === "V") a.swing++;
    if (r === "S" || r === "V") a.whiff++;
    byCount[balls(s) * 3 + strikes(s)][t]++;
    if (R[i] >= 0 && (R[i] & 1)) fin[t][R[i] >> 1]++;
  }
  return { by, byCount, fin };
}

/* ---------- 스트라이크존 캔버스 ---------- */
const XR = [-2.5, 2.5], ZR = [-0.2, 5.2];
let zoneCtx, zoneW = 0, zoneH = 0, zonePts = [];
function setupZone() {
  const box = $("zonebox"), cv = $("zone");
  zoneCtx = cv.getContext("2d");
  const ro = new ResizeObserver(() => {
    const r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    zoneW = r.width; zoneH = r.height;
    cv.width = Math.round(zoneW * dpr); cv.height = Math.round(zoneH * dpr);
    zoneCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawZone();
  });
  ro.observe(box);
  cv.addEventListener("mousemove", zoneHover);
  cv.addEventListener("mouseleave", hideTip);
  $("legend").addEventListener("click", (e) => {
    const c = e.target.closest(".chip"); if (!c) return;
    const t = +c.dataset.t;
    state.hidden.has(t) ? state.hidden.delete(t) : state.hidden.add(t);
    c.setAttribute("aria-pressed", String(!state.hidden.has(t)));
    drawZone(); drawTraj(); drawMove();
  });
}
const sx = (x) => (x - XR[0]) / (XR[1] - XR[0]) * zoneW;
const sz = (z) => zoneH - (z - ZR[0]) / (ZR[1] - ZR[0]) * zoneH;

function drawZone() {
  if (!zoneCtx || !zoneW) return;
  const ctx = zoneCtx, cs = getComputedStyle(document.documentElement);
  const ink = cs.getPropertyValue("--zone").trim(), faint = cs.getPropertyValue("--line").trim(), surface = cs.getPropertyValue("--surface").trim(), muted = cs.getPropertyValue("--muted").trim();
  ctx.clearRect(0, 0, zoneW, zoneH);
  const [zb, zt] = D.meta.zone, hw = 17 / 24;
  // 존 9분할 보조선
  ctx.strokeStyle = faint; ctx.lineWidth = 1;
  for (let k = 1; k < 3; k++) {
    const x = -hw + (2 * hw) * k / 3, z = zb + (zt - zb) * k / 3;
    ctx.beginPath(); ctx.moveTo(sx(x), sz(zb)); ctx.lineTo(sx(x), sz(zt)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx(-hw), sz(z)); ctx.lineTo(sx(hw), sz(z)); ctx.stroke();
  }
  // 홈플레이트 (포수 시점)
  const py = sz(0.05);
  ctx.fillStyle = faint;
  ctx.beginPath(); ctx.moveTo(sx(-hw), py); ctx.lineTo(sx(hw), py); ctx.lineTo(sx(hw), py + 5); ctx.lineTo(sx(0), py + 12); ctx.lineTo(sx(-hw), py + 5); ctx.closePath(); ctx.fill();

  // 투구 점
  const pts = [];
  for (const i of sel) {
    if (X[i] === -32768 || Z[i] === -32768 || state.hidden.has(T[i])) continue;
    pts.push(i);
  }
  zonePts = pts;
  const many = pts.length > 4000;
  const r = pts.length > 20000 ? 2 : pts.length > 4000 ? 2.6 : 4.2;
  ctx.globalAlpha = pts.length > 20000 ? 0.28 : pts.length > 4000 ? 0.5 : 0.85;
  for (const i of pts) {
    const x = sx(X[i] / 100), y = sz(Z[i] / 100);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = colors[T[i]]; ctx.fill();
    if (!many) { ctx.lineWidth = 1; ctx.strokeStyle = surface; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  // 스트라이크존 외곽은 점 위에
  ctx.strokeStyle = ink; ctx.lineWidth = 2;
  ctx.strokeRect(sx(-hw), sz(zt), sx(hw) - sx(-hw), sz(zb) - sz(zt));
  ctx.fillStyle = muted; ctx.font = "11px " + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "left"; ctx.fillText(`${fmt(pts.length)}구 표시`, 6, 14);
}

function zoneHover(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let best = -1, bd = 64;
  for (const i of zonePts) {
    const dx = sx(X[i] / 100) - mx, dy = sz(Z[i] / 100) - my, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  if (best < 0) return hideTip();
  const s = S[best], p = D.pitchers[P[best]], b = D.batters[B[best]];
  const bs = bases(s);
  const runners = bs ? ["1", "2", "3"].filter((_, k) => bs >> k & 1).join("·") + "루" : "주자 없음";
  const pa = R[best] >= 0 ? `<br>타석 결과: <b>${esc(D.pa_results[R[best] >> 1])}</b>${R[best] & 1 ? " (결정구)" : ""}` : "";
  showTip(e.clientX, e.clientY, `<b>${esc(D.types[T[best]])} ${V[best] || "–"}km/h</b> · ${RESULT_LABEL[D.results[result(s)]] || "–"}${pa}<br>
    ${esc(p[0])} → ${esc(b[0])} (${lefty(s) ? "좌" : "우"}타)<br>
    <span class="m">${balls(s)}-${strikes(s)} · ${outs(s)}아웃 · ${runners}<br>${D.dates[DT[best]]}</span>`);
}

const tip = $("tip");

/* ---------- 투구 궤적 ---------- */
// 궤적 파라미터 [x0, z0, vx0, vy0, vz0, ax, ay, az], y0 = 50ft. 위치 = r0 + v0 t + a t^2 / 2
const TK = ["x0", "z0", "vx0", "vy0", "vz0", "ax", "ay", "az"];
const Y0 = 50, Y_PLATE = 17 / 12, Y_RELEASE = 54.5, Y_RUBBER = 60.5;
let TR = null;  // Float32Array(N * 8), 아직 안 불러온 투구는 NaN
const trajLoaded = new Map();
let trajView = "catcher", trajMode = "avg", trajStatus = "", trajSpeed = 0.25, anim = null;
let tunBase = null, tunComp = null, tunCtx, tunW = 0, tunH = 0, sepCtx, sepW = 0, sepH = 0;
const DECISION = 0.167;  // 타자 판단 시점: 홈 도착 0.167초 전
let trajCtx, trajW = 0, trajH = 0, moveCtx, moveW = 0, moveH = 0, moveMeans = [];

function setupCanvas(boxId, canvasId, onSize) {
  const box = $(boxId), cv = $(canvasId), ctx = cv.getContext("2d");
  new ResizeObserver(() => {
    const r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);

}
function setupTrajMove() {
  setupCanvas("trajbox", "traj", (ctx, w, h) => { trajCtx = ctx; trajW = w; trajH = h; drawTraj(); });
  setupCanvas("movebox", "move", (ctx, w, h) => { moveCtx = ctx; moveW = w; moveH = h; drawMove(); });
  for (const [id, set] of [["traj-view", (v) => trajView = v], ["traj-mode", (v) => trajMode = v], ["traj-speed", (v) => trajSpeed = +v]]) {
    $(id).addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      set(b.dataset.v);
      for (const x of $(id).querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
      if (id === "traj-speed") playTraj(); else { stopAnim(); drawTraj(); }
    });
  }
  $("traj-play").addEventListener("click", playTraj);
  setupCanvas("tunbox", "tun", (ctx, w, h) => { tunCtx = ctx; tunW = w; tunH = h; drawTunnel(); });
  setupCanvas("sepbox", "sep", (ctx, w, h) => { sepCtx = ctx; sepW = w; sepH = h; drawTunnel(); });
  $("tun-base").addEventListener("change", (e) => { tunBase = +e.target.value; tunComp = null; drawTunnel(); });
  $("tuntable").addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-t]"); if (!tr) return;
    tunComp = +tr.dataset.t; drawTunnel();
  });
  $("move").addEventListener("mousemove", moveHover);
  $("move").addEventListener("mouseleave", hideTip);
}

function trajTeam() {
  if (state.pitcher !== "all") return D.pitchers[+state.pitcher][1];
  return state.team === "all" ? -1 : +state.team;
}
function ensureTraj(team) {
  if (!trajLoaded.has(team)) {
    const pr = fetch(`traj/${team}.json`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((t) => {
      if (!TR) TR = new Float32Array(N * 8).fill(NaN);
      t.i.forEach((gi, k) => { for (let j = 0; j < 8; j++) TR[gi * 8 + j] = t[TK[j]][k] / 100; });
    });
    pr.catch(() => trajLoaded.delete(team));
    trajLoaded.set(team, pr);
  }
  return trajLoaded.get(team);
}
function refreshTraj() {
  stopAnim();
  const team = trajTeam();
  const redraw = () => { drawTraj(); drawTunnel(); };
  if (team < 0) { trajStatus = "팀이나 투수를 고르면 궤적을 그립니다."; return redraw(); }
  trajStatus = "궤적 데이터를 불러오는 중…"; redraw();
  ensureTraj(team).then(() => { trajStatus = ""; redraw(); }, () => { trajStatus = "궤적 데이터를 불러오지 못했습니다."; redraw(); });
}

/* 재생: 릴리스 이후 경과 시간(초)만큼만 궤적을 그린다. 구종마다 실제 비행 시간대로 도착한다. */
function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
function playTraj() {
  stopAnim();
  if (trajStatus) return;
  const start = performance.now();
  const step = (now) => {
    const tNow = (now - start) / 1000 * trajSpeed;
    if (tNow < 0.7) { drawTraj(tNow); anim = requestAnimationFrame(step); }
    else { anim = null; drawTraj(); }
  };
  anim = requestAnimationFrame(step);
}

/* 선택된 투구로 구종별 평균 궤적 파라미터를 구한다. */
function typeMeans(respectHidden) {
  const p = new Float32Array(8), nt = D.types.length;
  const sums = Array.from({ length: nt }, () => new Float64Array(9));
  for (const i of sel) {
    const t = T[i];
    if ((respectHidden && state.hidden.has(t)) || !trajParams(i, p)) continue;
    const s = sums[t]; for (let j = 0; j < 8; j++) s[j] += p[j]; s[8]++;
  }
  return sums.map((s, t) => ({ t, n: s[8], m: s[8] ? Array.from(s.slice(0, 8), (v) => v / s[8]) : null }));
}
function posAt(m, t) { return [m[0] + m[2] * t + m[5] * t * t / 2, Y0 + m[3] * t + m[6] * t * t / 2, m[1] + m[4] * t + m[7] * t * t / 2]; }

function tAtY(p, y) {
  const a = p[6] / 2, b = p[3], c = Y0 - y, disc = b * b - 4 * a * c;
  if (disc < 0 || a === 0) return null;
  return (-b - Math.sqrt(disc)) / (2 * a);
}
function pathOf(p, steps, tNow = Infinity) {
  const t0 = tAtY(p, Y_RELEASE), t1 = tAtY(p, Y_PLATE);
  if (t0 == null || t1 == null) return null;
  const tEnd = Math.min(t1, t0 + tNow), pts = [];
  for (let k = 0; k <= steps; k++) {
    const t = t0 + (tEnd - t0) * k / steps;
    pts.push([p[0] + p[2] * t + p[5] * t * t / 2, Y0 + p[3] * t + p[6] * t * t / 2, p[1] + p[4] * t + p[7] * t * t / 2]);
  }
  return pts;
}
function projector(view, w, h) {
  const pad = 30;
  if (view === "catcher") {
    // 홈플레이트 뒤 20ft, 릴리스와 비슷한 높이(4.6ft)에 카메라를 둔 원근 투영 (Statcast 포수 시점과 비슷한 구도)
    const camY = -20, camZ = 4.6, d0 = Y_PLATE - camY, f = Math.min(w * 0.5 * d0 / 2.8, h * 4.2);
    return ([x, y, z]) => { const d = y - camY; return [w / 2 + f * x / d, h * 0.22 - f * (z - camZ) / d]; };
  }
  const sx = (y) => pad + (Y_RUBBER + 1 - y) / (Y_RUBBER + 1) * (w - pad * 2);
  if (view === "side") return ([x, y, z]) => [sx(y), h - pad - z / 8 * (h - pad * 2)];
  return ([x, y, z]) => [sx(y), h / 2 - x / 3 * (h / 2 - pad)];  // 위에서 본 모습: 위쪽이 1루
}
function trajParams(i, out) {
  const o = i * 8;
  if (!TR || Number.isNaN(TR[o])) return false;
  for (let j = 0; j < 8; j++) out[j] = TR[o + j];
  return true;
}

function drawTraj(tNow = Infinity) {
  if (!trajCtx || !trajW) return;
  const playing = Number.isFinite(tNow);
  const ctx = trajCtx, w = trajW, h = trajH, cs = getComputedStyle(document.documentElement);
  const tok = (n) => cs.getPropertyValue(n).trim();
  const line = tok("--line"), muted = tok("--muted"), ink = tok("--zone"), surface = tok("--surface");
  const font = getComputedStyle(document.body).fontFamily;
  ctx.clearRect(0, 0, w, h);
  const pr = projector(trajView, w, h);
  const poly = (pts, close) => { ctx.beginPath(); pts.forEach((q, k) => { const [a, b] = pr(q); k ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); if (close) ctx.closePath(); };
  const [zb, zt] = D.meta.zone, hw = 17 / 24;
  ctx.font = "11px " + font; ctx.fillStyle = muted; ctx.strokeStyle = line; ctx.lineWidth = 1;

  // 배경: 홈플레이트, 스트라이크존, 투수판
  if (trajView === "catcher") {
    ctx.fillStyle = line;
    poly([[-hw, Y_PLATE, 0], [hw, Y_PLATE, 0], [hw, hw, 0], [0, 0, 0], [-hw, hw, 0]], true); ctx.fill();
    poly([[-1, Y_RUBBER, 0.83], [1, Y_RUBBER, 0.83]]); ctx.lineWidth = 3; ctx.strokeStyle = line; ctx.stroke();
  } else if (trajView === "side") {
    ctx.beginPath(); const [g0, gy] = pr([0, Y_RUBBER + 1, 0]), [g1] = pr([0, 0, 0]); ctx.moveTo(g0, gy); ctx.lineTo(g1, gy); ctx.stroke();
    // 마운드: 투수판 높이 10인치, 앞쪽으로 완만하게 내려감
    ctx.fillStyle = line; poly([[0, Y_RUBBER + 1, 0], [0, Y_RUBBER + 1, 0.83], [0, Y_RUBBER - 0.5, 0.83], [0, Y_RUBBER - 6.5, 0.33], [0, Y_RUBBER - 9, 0]], true); ctx.fill();
    ctx.fillStyle = muted; ctx.textAlign = "center";
    for (let ft = 0; ft <= 60; ft += 10) { const [a] = pr([0, ft, 0]); ctx.fillText(`${ft}ft`, a, gy + 16); }
  } else {
    ctx.beginPath(); const [a0, my] = pr([0, Y_RUBBER + 1, 0]), [a1] = pr([0, 0, 0]); ctx.setLineDash([4, 4]); ctx.moveTo(a0, my); ctx.lineTo(a1, my); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = line; poly([[-hw, Y_PLATE, 0], [hw, Y_PLATE, 0], [hw, hw, 0], [0, 0, 0], [-hw, hw, 0]], true); ctx.fill();
    poly([[-1, Y_RUBBER, 0], [1, Y_RUBBER, 0]]); ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = muted; ctx.textAlign = "left"; ctx.fillText("1루 쪽", 8, 16); ctx.fillText("3루 쪽", 8, h - 8);
  }

  if (trajStatus) {
    ctx.fillStyle = muted; ctx.textAlign = "center"; ctx.font = "13px " + font;
    ctx.fillText(trajStatus, w / 2, h / 2);
    return;
  }

  // 데이터: 구종별 평균 궤적 또는 개별 투구
  const p = new Float32Array(8), nt = D.types.length;
  const sums = Array.from({ length: nt }, () => new Float64Array(9));
  const each = [];
  for (const i of sel) {
    const t = T[i];
    if (state.hidden.has(t) || !trajParams(i, p)) continue;
    const s = sums[t]; for (let j = 0; j < 8; j++) s[j] += p[j]; s[8]++;
    each.push(i);
  }
  const shown = each.length, stride = Math.max(1, Math.ceil(shown / (playing ? 40 : 300)));
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (trajMode === "each") {
    ctx.lineWidth = 1; ctx.globalAlpha = shown > 100 ? 0.35 : 0.6;
    for (let k = 0; k < shown; k += stride) {
      const i = each[k]; trajParams(i, p);
      const pts = pathOf(p, 16, tNow); if (!pts) continue;
      ctx.strokeStyle = colors[T[i]]; poly(pts); ctx.stroke();
      if (playing) {
        const [bx, by] = pr(pts[pts.length - 1]);
        ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI * 2); ctx.fillStyle = colors[T[i]]; ctx.fill();
        ctx.globalAlpha = shown > 100 ? 0.35 : 0.6;
      }
    }
    ctx.globalAlpha = 1;
  } else {
    const order = sums.map((s, t) => ({ t, n: s[8] })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
    for (const { t, n } of order) {
      const m = Array.from(sums[t].slice(0, 8), (v) => v / n);
      const pts = pathOf(m, 32, tNow); if (!pts) continue;
      // 측정 시작(50ft) 이전 추정 구간은 점선
      const cut = pts.findIndex((q) => q[1] <= Y0);
      ctx.strokeStyle = colors[t]; ctx.lineWidth = 3;
      ctx.setLineDash([3, 4]); poly(cut < 0 ? pts : pts.slice(0, cut + 1)); ctx.stroke(); ctx.setLineDash([]);
      if (cut >= 0) { poly(pts.slice(cut)); ctx.stroke(); }
      const [ex, ey] = pr(pts[pts.length - 1]);
      ctx.beginPath(); ctx.arc(ex, ey, playing ? 6 : 5, 0, Math.PI * 2); ctx.fillStyle = colors[t]; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke();
    }
  }

  // 스트라이크존은 궤적 위에
  ctx.strokeStyle = ink; ctx.lineWidth = 1.5;
  if (trajView === "catcher") { poly([[-hw, Y_PLATE, zb], [hw, Y_PLATE, zb], [hw, Y_PLATE, zt], [-hw, Y_PLATE, zt]], true); ctx.stroke(); }
  else if (trajView === "side") { poly([[0, Y_PLATE, zb], [0, Y_PLATE, zt]]); ctx.lineWidth = 3; ctx.stroke(); }
  else { poly([[-hw, Y_PLATE, 0], [hw, Y_PLATE, 0]]); ctx.lineWidth = 3; ctx.stroke(); }
  ctx.fillStyle = muted; ctx.font = "11px " + font; ctx.textAlign = "right";
  const label = (trajMode === "each" ? `${fmt(Math.ceil(shown / stride))}구 표시` : `${fmt(shown)}구 평균`)
    + (playing ? ` · 릴리스 후 ${tNow.toFixed(3)}초` : "");
  ctx.fillText(label, w - 8, 16);
  if (trajView === "side") { ctx.textAlign = "left"; ctx.fillText("투수판", 6, 16); }
}

/* ---------- 터널링 ---------- */
// 두 구종의 평균 궤적을 '홈 도착 전 같은 시간'에 맞춰 비교한다 (Baseball Prospectus의 터널링 방식).
function tunnelStats(a, b) {
  const ta = tAtY(a, Y_PLATE), tb = tAtY(b, Y_PLATE);
  const ra = tAtY(a, Y_RELEASE), rb = tAtY(b, Y_RELEASE);
  const gap = (pa, pb) => Math.hypot(pa[0] - pb[0], pa[2] - pb[2]) * 30.48;  // 포수 시점 평면 거리(cm)
  const at = (tau) => gap(posAt(a, ta - tau), posAt(b, tb - tau));
  const flight = Math.min(ta - ra, tb - rb);
  const curve = [];
  for (let k = 0; k <= 40; k++) { const tau = flight * (1 - k / 40); curve.push([tau, at(tau)]); }
  const release = gap(posAt(a, ra), posAt(b, rb)), decision = at(DECISION), plate = at(0);
  return { release, decision, plate, ratio: decision > 0 ? plate / decision : 0, curve, flight };
}

function fillTunnelBase(means) {
  const present = means.filter((x) => x.n >= 10).sort((p, q) => q.n - p.n);
  const ok = present.some((x) => x.t === tunBase);
  if (!ok) tunBase = present.length ? present[0].t : null;
  $("tun-base").innerHTML = present.map((x) => `<option value="${x.t}">${esc(D.types[x.t])} (${fmt(x.n)}구)</option>`).join("") || `<option>–</option>`;
  if (tunBase != null) $("tun-base").value = String(tunBase);
  return present;
}

function drawTunnel() {
  if (!tunCtx || !tunW || !sepCtx || !sepW || !D) return;
  const cs = getComputedStyle(document.documentElement), tok = (n) => cs.getPropertyValue(n).trim();
  const line = tok("--line"), muted = tok("--muted"), ink = tok("--zone"), surface = tok("--surface"), accent = tok("--accent");
  const font = getComputedStyle(document.body).fontFamily;
  for (const [c, w, h] of [[tunCtx, tunW, tunH], [sepCtx, sepW, sepH]]) c.clearRect(0, 0, w, h);
  const msg = (text) => {
    for (const [c, w, h] of [[tunCtx, tunW, tunH], [sepCtx, sepW, sepH]]) { c.fillStyle = muted; c.font = "13px " + font; c.textAlign = "center"; c.fillText(text, w / 2, h / 2); }
    $("tuntable").innerHTML = "";
  };
  if (trajStatus) return msg(trajStatus);
  const means = typeMeans(false);
  const present = fillTunnelBase(means);
  if (tunBase == null || present.length < 2) return msg("비교하려면 10구 이상 던진 구종이 2개 이상 필요합니다.");
  const base = means[tunBase];
  const rows = present.filter((x) => x.t !== tunBase).map((x) => ({ t: x.t, n: x.n, ...tunnelStats(base.m, x.m) }));
  if (!rows.some((r) => r.t === tunComp)) tunComp = rows[0].t;
  const comp = means[tunComp], cur = rows.find((r) => r.t === tunComp);

  // 표
  $("tuntable").innerHTML = `<thead><tr><th>비교 구종</th><th>투구 수</th><th>릴리스 차이</th><th>판단 시점 차이</th><th>홈 도착 차이</th><th>갈라짐 배율</th></tr></thead><tbody>` +
    rows.map((r) => `<tr data-t="${r.t}" aria-selected="${r.t === tunComp}"><td><span class="tname"><i style="background:${colors[r.t]}"></i>${esc(D.types[r.t])}</span></td><td>${fmt(r.n)}</td><td>${r.release.toFixed(1)}cm</td><td>${r.decision.toFixed(1)}cm</td><td>${r.plate.toFixed(1)}cm</td><td>${r.ratio.toFixed(1)}배</td></tr>`).join("") + "</tbody>";

  // 왼쪽: 포수 시점에 두 궤적 + 판단 시점·홈 도착 위치
  {
    const ctx = tunCtx, w = tunW, h = tunH, pr = projector("catcher", w, h);
    const poly = (pts) => { ctx.beginPath(); pts.forEach((q, k) => { const [a, b] = pr(q); k ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); };
    const [zb, zt] = D.meta.zone, hw = 17 / 24;
    ctx.lineCap = "round";
    for (const x of [base, comp]) {
      const pts = pathOf(x.m, 40); if (!pts) continue;
      ctx.strokeStyle = colors[x.t]; ctx.lineWidth = 3; poly(pts); ctx.stroke();
    }
    ctx.strokeStyle = ink; ctx.lineWidth = 1.5; poly([[-hw, Y_PLATE, zb], [hw, Y_PLATE, zb], [hw, Y_PLATE, zt], [-hw, Y_PLATE, zt], [-hw, Y_PLATE, zb]]); ctx.stroke();
    const mark = (tau, label) => {
      const pa = posAt(base.m, tAtY(base.m, Y_PLATE) - tau), pb = posAt(comp.m, tAtY(comp.m, Y_PLATE) - tau);
      const [ax, ay] = pr(pa), [bx, by] = pr(pb);
      ctx.strokeStyle = muted; ctx.lineWidth = 1; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.setLineDash([]);
      for (const [x, y, c] of [[ax, ay, colors[base.t]], [bx, by, colors[comp.t]]]) { ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke(); }
      ctx.fillStyle = muted; ctx.font = "11px " + font; ctx.textAlign = "left"; ctx.fillText(label, Math.max(ax, bx) + 9, (ay + by) / 2 + 4);
    };
    mark(DECISION, `판단 시점 ${cur.decision.toFixed(0)}cm`);
    mark(0, `홈 도착 ${cur.plate.toFixed(0)}cm`);
    ctx.font = "600 12px " + font; ctx.textAlign = "left";
    ctx.fillStyle = colors[base.t]; ctx.fillText("● " + D.types[base.t], 8, 18);
    ctx.fillStyle = colors[comp.t]; ctx.fillText("● " + D.types[comp.t], 8, 36);
  }

  // 오른쪽: 홈 도착 전 시간에 따른 거리
  {
    const ctx = sepCtx, w = sepW, h = sepH, padL = 44, padR = 16, padT = 16, padB = 34;
    const tMax = Math.max(...rows.map((r) => r.flight)), yMax = Math.max(40, Math.ceil(Math.max(...rows.map((r) => r.plate)) / 20) * 20);
    const X = (tau) => padL + (tMax - tau) / tMax * (w - padL - padR);
    const Y = (v) => h - padB - v / yMax * (h - padT - padB);
    ctx.font = "11px " + font; ctx.fillStyle = muted; ctx.strokeStyle = line; ctx.lineWidth = 1;
    ctx.textAlign = "right";
    for (let v = 0; v <= yMax; v += yMax > 80 ? 40 : 20) { ctx.globalAlpha = v ? 0.6 : 1; ctx.beginPath(); ctx.moveTo(padL, Y(v)); ctx.lineTo(w - padR, Y(v)); ctx.stroke(); ctx.globalAlpha = 1; ctx.fillText(`${v}cm`, padL - 6, Y(v) + 4); }
    ctx.textAlign = "center";
    for (let tau = 0; tau <= tMax + 1e-9; tau += 0.1) ctx.fillText(tau ? `${tau.toFixed(1)}초 전` : "홈 도착", X(tau), h - padB + 16);
    // 판단 시점
    ctx.strokeStyle = accent; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(DECISION), padT); ctx.lineTo(X(DECISION), h - padB); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = accent; ctx.textAlign = "right"; ctx.fillText("타자 판단 시점", X(DECISION) - 6, padT + 10);
    // 구종별 선: 선택한 비교 구종을 진하게
    const ordered = [...rows].sort((a, b) => (a.t === tunComp) - (b.t === tunComp));
    for (const r of ordered) {
      const active = r.t === tunComp;
      ctx.globalAlpha = active ? 1 : 0.35; ctx.strokeStyle = colors[r.t]; ctx.lineWidth = active ? 3 : 2; ctx.lineJoin = "round";
      ctx.beginPath(); r.curve.forEach(([tau, v], k) => k ? ctx.lineTo(X(tau), Y(v)) : ctx.moveTo(X(tau), Y(v))); ctx.stroke();
      ctx.globalAlpha = 1;
      if (active) {
        for (const [tau, v] of [[DECISION, r.decision], [0, r.plate]]) { ctx.beginPath(); ctx.arc(X(tau), Y(v), 4.5, 0, Math.PI * 2); ctx.fillStyle = colors[r.t]; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke(); }
      }
    }
    ctx.fillStyle = muted; ctx.textAlign = "left"; ctx.fillText(`${D.types[tunBase]} 기준 거리`, padL + 4, padT + 10);
  }
}

/* ---------- 무브먼트 ---------- */
const MXR = [-70, 70], MZR = [-60, 70], MOVE_PAD = 34;
function drawMove() {
  if (!moveCtx || !moveW) return;
  const ctx = moveCtx, w = moveW, h = moveH, cs = getComputedStyle(document.documentElement);
  const tok = (n) => cs.getPropertyValue(n).trim();
  const line = tok("--line"), muted = tok("--muted"), surface = tok("--surface"), ink = tok("--ink");
  const font = getComputedStyle(document.body).fontFamily;
  const pad = MOVE_PAD;
  const mx = (v) => pad + (v - MXR[0]) / (MXR[1] - MXR[0]) * (w - pad * 2);
  const mz = (v) => h - pad - (v - MZR[0]) / (MZR[1] - MZR[0]) * (h - pad * 2);
  ctx.clearRect(0, 0, w, h);
  ctx.font = "11px " + font; ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.fillStyle = muted;
  // 20cm 격자
  ctx.textAlign = "center";
  for (let v = -60; v <= 60; v += 20) { ctx.globalAlpha = v ? 0.5 : 1; ctx.beginPath(); ctx.moveTo(mx(v), mz(MZR[0])); ctx.lineTo(mx(v), mz(MZR[1])); ctx.stroke(); ctx.globalAlpha = 1; ctx.fillText(v, mx(v), h - pad + 14); }
  ctx.textAlign = "right";
  for (let v = -60; v <= 60; v += 20) { ctx.globalAlpha = v ? 0.5 : 1; ctx.beginPath(); ctx.moveTo(mx(MXR[0]), mz(v)); ctx.lineTo(mx(MXR[1]), mz(v)); ctx.stroke(); ctx.globalAlpha = 1; ctx.fillText(v, pad - 4, mz(v) + 4); }
  // 방향 안내: 투수가 정해지면 팔 쪽/글러브 쪽
  const pit = state.pitcher === "all" ? null : D.pitchers[+state.pitcher];
  const left = pit && pit[2] ? (pit[2] === "R" ? "← 팔 쪽 (3루)" : "← 글러브 쪽 (3루)") : "← 3루 쪽";
  const right = pit && pit[2] ? (pit[2] === "R" ? "글러브 쪽 (1루) →" : "팔 쪽 (1루) →") : "1루 쪽 →";
  ctx.textAlign = "left"; ctx.fillText(left, pad + 4, pad - 10);
  ctx.textAlign = "right"; ctx.fillText(right, w - pad - 4, pad - 10);
  ctx.textAlign = "left";
  ctx.fillText("↑ 덜 떨어짐", mx(MXR[0]) + 6, mz(MZR[1]) + 14);
  ctx.fillText("↓ 더 떨어짐", mx(MXR[0]) + 6, mz(MZR[0]) - 6);

  const nt = D.types.length, sums = Array.from({ length: nt }, () => [0, 0, 0, 0, 0]);
  const pts = [];
  for (const i of sel) {
    if (MX[i] === -32768 || state.hidden.has(T[i])) continue;
    pts.push(i);
    const s = sums[T[i]]; s[0] += MX[i]; s[1] += MZ[i]; s[2]++; if (V[i]) { s[3] += V[i]; s[4]++; }
  }
  const r = pts.length > 20000 ? 1.4 : pts.length > 3000 ? 2 : 3;
  ctx.globalAlpha = pts.length > 20000 ? 0.12 : pts.length > 3000 ? 0.3 : 0.55;
  for (const i of pts) { ctx.beginPath(); ctx.arc(mx(MX[i]), mz(MZ[i]), r, 0, Math.PI * 2); ctx.fillStyle = colors[T[i]]; ctx.fill(); }
  ctx.globalAlpha = 1;
  moveMeans = sums.map((s, t) => ({ t, n: s[2], h: s[0] / s[2], v: s[1] / s[2], kmh: s[4] ? s[3] / s[4] : 0 })).filter((m) => m.n > 0).sort((a, b) => b.n - a.n);
  for (const m of moveMeans) {
    const x = mx(m.h), y = mz(m.v);
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = colors[m.t]; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke();
    ctx.fillStyle = ink; ctx.textAlign = "left"; ctx.font = "600 12px " + font;
    ctx.fillText(D.types[m.t], x + 10, y + 4); ctx.font = "11px " + font;
  }
  $("movetable").innerHTML = `<thead><tr><th>구종</th><th>투구 수</th><th>평균 구속</th><th>수평 cm</th><th>수직 cm</th></tr></thead><tbody>` +
    (moveMeans.length ? moveMeans.map((m) => `<tr><td><span class="tname"><i style="background:${colors[m.t]}"></i>${esc(D.types[m.t])}</span></td><td>${fmt(m.n)}</td><td>${m.kmh ? m.kmh.toFixed(1) : "–"}</td><td>${m.h.toFixed(1)}</td><td>${m.v.toFixed(1)}</td></tr>`).join("")
      : `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:16px">표시할 투구가 없습니다.</td></tr>`) + "</tbody>";
}
function moveHover(e) {
  const rect = e.currentTarget.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top, pad = MOVE_PAD;
  const mx = (v) => pad + (v - MXR[0]) / (MXR[1] - MXR[0]) * (moveW - pad * 2);
  const mz = (v) => moveH - pad - (v - MZR[0]) / (MZR[1] - MZR[0]) * (moveH - pad * 2);
  let best = null, bd = 196;
  for (const m of moveMeans) { const d = (mx(m.h) - x) ** 2 + (mz(m.v) - y) ** 2; if (d < bd) { bd = d; best = m; } }
  if (!best) return hideTip();
  showTip(e.clientX, e.clientY, `<b>${esc(D.types[best.t])}</b> 평균 · ${fmt(best.n)}구<br><span class="m">수평 ${best.h.toFixed(1)}cm · 수직 ${best.v.toFixed(1)}cm<br>${best.kmh.toFixed(1)}km/h</span>`);
}

function update() {
  filter();
  const agg = aggregate();
  renderStatline(agg); renderMix(agg); renderFinish(agg); renderCounts(agg); renderLegend(agg); drawZone();
  drawMove(); refreshTraj();
}

function onTheme() { if (!D) return; readColors(); update(); }
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

fetch("pitches.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((data) => {
  decode(data);
  readColors();
  $("season").textContent = `${data.dates[0]} ~ ${data.dates[data.dates.length - 1]} · ${fmt(data.meta.games)}경기 · ${fmt(N)}구`;
  fillTeams(); fillCounts(); fillMonths();
  // 첫 화면: 가장 많이 던진 투수
  let top = 0; for (let i = 1; i < pitchCount.length; i++) if (pitchCount[i] > pitchCount[top]) top = i;
  state.pitcher = String(top);
  shell(); bindControls(); syncControls(); update();
}).catch((err) => {
  $("main").innerHTML = `<div class="state">투구 데이터(pitches.json)를 불러오지 못했습니다 (${esc(err.message)}). 같은 폴더에서 <code>python -m http.server</code>로 열어 주세요.</div>`;
});
})();
</script>
