// 시뮬레이션 결과 -> 기대 득점표의 타석 결과 이름
const PA_VALUE_KEY = { "직선타": "라인드라이브", "실책": "실책출루" };
const HITS = ["1루타", "2루타", "3루타", "홈런"], TB = { "1루타": 1, "2루타": 2, "3루타": 3, "홈런": 4 };
const SAME_PA = { "병살타": "땅볼", "희생번트": "땅볼", "번트아웃": "땅볼", "야수선택": "땅볼", "기타": "땅볼",
  "희생플라이": "플라이", "라인드라이브": "직선타", "실책출루": "실책", "고의4구": "볼넷" };
const OUTCOME_ORDER = ["삼진", "볼넷", "사구", "1루타", "2루타", "3루타", "홈런", "땅볼", "플라이", "직선타", "실책"];

function ensureSim() {
  if (!SIM) SIM = BallSim.create({ N, P, B, T, S, PV: D.cols.pv, ZN: D.cols.zn, RV: D.cols.rv, R, hands: D.pitchers.map((p) => p[2]),
    nTypes: D.types.length, model: D.model, results: D.results, paResults: D.pa_results }, ensurePredictModel());
  return SIM;
}

function setupSim() {
  setupCanvas("simbox", "simcv", (ctx, w, h) => { simCtx = ctx; simW = w; simH = h; drawSim(simAnimT); });
  $("sim-batter").addEventListener("change", (e) => { sm.batter = +e.target.value; if (sm.batter >= 0) sm.stance = batterStance(sm.batter, sm.pitcher); syncSim(); });
  $("sim-stance").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { sm.stance = +b.dataset.v; syncSim(); } });
  $("sim-n").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { sm.n = +b.dataset.v; syncSim(); } });
  $("sim-first").addEventListener("change", (e) => { sm.first = +e.target.value; });
  $("sim-two").addEventListener("change", (e) => { sm.two = +e.target.value; });
  $("sim-new").addEventListener("click", newSimPA);
  $("sim-next").addEventListener("click", () => playPitch());
  $("sim-auto").addEventListener("click", () => {
    sm.auto = !sm.auto; $("sim-auto").setAttribute("aria-pressed", String(sm.auto));
    if (sm.auto && simPA && simStep < simPA.pitches.length && !simRaf) playPitch();
  });
  $("sim-run").addEventListener("click", runBatch);
}
function syncSim() {
  for (const [id, v] of [["sim-stance", sm.stance], ["sim-n", sm.n]]) for (const b of $(id).querySelectorAll("button")) b.setAttribute("aria-pressed", String(+b.dataset.v === v));
  const pi = D.pitchers[sm.pitcher];
  $("sim-matchup").innerHTML = `${esc(pi[0])}<span>vs</span>${sm.batter >= 0 ? esc(D.batters[sm.batter][0]) : "리그 평균 타자"} <span style="font-size:13px">(${sm.stance ? "좌타" : "우타"})</span>`;
}

function renderSim() {
  if (!$("sim-root") || $("sim").hidden) return;
  if (state.pitcher === "all") {
    $("sim-out").innerHTML = `<div class="empty-state">위 검색창에서 투수를 한 명 고르면 맞대결을 시뮬레이션합니다.</div>`;
    $("sset-who").textContent = ""; $("sim-matchup").textContent = "";
    return;
  }
  const pitcher = +state.pitcher;
  if (sm.pitcher === pitcher) { if (!simRaf) drawSim(); return; }  // 테마가 바뀌면 다시 그린다
  stopSimPA();
  sm.pitcher = pitcher; sm.batter = -1; sm.stance = D.pitchers[pitcher][2] === "L" ? 0 : 1; sm.first = -1; sm.two = -1; simPA = null;
  const pi = D.pitchers[pitcher];
  $("sset-who").innerHTML = `투수 <b style="color:var(--ink)">${esc(pi[0])}</b> · ${esc(D.teams[pi[1]])} · ${pi[2] === "L" ? "좌투" : "우투"} <span style="color:var(--faint)">(바꾸려면 위 검색창)</span>`;
  $("sim-batter").innerHTML = batterOptions(pitcher, "리그 평균 타자");
  const ars = arsenalOf(pitcher);
  const typeOpts = `<option value="-1">모델대로 (이 투수의 실제 경향)</option>` + ars.map((x) => `<option value="${x.t}">${esc(D.types[x.t])}만 던지기</option>`).join("");
  $("sim-first").innerHTML = typeOpts; $("sim-two").innerHTML = typeOpts;
  $("sim-log").innerHTML = `<li class="hint">‘새 타석’을 누르면 공 하나씩 진행됩니다.</li>`;
  $("sim-out").innerHTML = `<div class="empty-state">‘시뮬레이션 실행’을 누르면 결과가 나옵니다.</div>`;
  $("sim-banner").hidden = true; $("sim-next").disabled = true;
  setLamps(0, 0, 0);
  syncSim(); drawSim();
}

function setLamps(b, s, n) {
  document.querySelectorAll(".lamps .b i").forEach((el, k) => el.classList.toggle("on", k < b));
  document.querySelectorAll(".lamps .s i").forEach((el, k) => el.classList.toggle("on", k < s));
  $("sim-pc").textContent = `${n}구`;
}
function stopSimPA() { clearTimeout(simTimer); cancelAnimationFrame(simRaf); simRaf = 0; simAnimT = null; }

function newSimPA() {
  if (state.pitcher === "all") return;
  stopSimPA();
  const sim = ensureSim();
  const team = D.pitchers[sm.pitcher][1];
  $("sim-new").disabled = true;
  ensureTraj(team).catch(() => null).then(() => {
    $("sim-new").disabled = false;
    simPA = sim.simulatePA({ pitcher: sm.pitcher, batter: sm.batter, stance: sm.stance, strategy: { first: sm.first, two: sm.two } },
      BallSim.mulberry32((Math.random() * 2 ** 32) >>> 0));
    simPA.pitches.forEach((p) => { const prm = new Float32Array(NP); p.params = p.real >= 0 && trajParams(p.real, prm) ? prm : null; });
    simStep = 0;
    $("sim-log").innerHTML = ""; $("sim-banner").hidden = true;
    setLamps(0, 0, 0); drawSim();
    $("sim-next").disabled = false;
    playPitch();
  });
}

// 공 하나를 날리고, 도착하면 기록·볼카운트를 갱신한다
function playPitch() {
  if (!simPA || simStep >= simPA.pitches.length || simRaf) return;
  const p = simPA.pitches[simStep];
  $("sim-next").disabled = true;
  const finish = () => {
    simRaf = 0; simAnimT = null; simStep++;
    logPitch(p, simStep);
    drawSim();
    const done = simStep >= simPA.pitches.length;
    if (done) return showBanner();
    $("sim-next").disabled = false;
    if (sm.auto) simTimer = setTimeout(playPitch, 750);
  };
  if (!p.params || REDUCED) return finish();
  const t0 = tAtY(p.params, Y_RELEASE), t1 = tAtY(p.params, Y_PLATE), flight = t1 - t0, slow = 2.2;
  const start = performance.now();
  const step = (now) => {
    const t = (now - start) / 1000 / slow;
    if (t >= flight) return finish();
    simAnimT = t; drawSim(t);
    simRaf = requestAnimationFrame(step);
  };
  simRaf = requestAnimationFrame(step);
}

function countAfter(p) {
  let b = p.balls, s = p.strikes;
  if (p.res === 0) b++; else if (p.res === 1 || p.res === 2) s++; else if (p.res === 3 && s < 2) s++;
  return [b, s];
}
function logPitch(p, k) {
  const [b, s] = countAfter(p);
  setLamps(Math.min(b, 3), Math.min(s, 2), k);
  const speed = p.real >= 0 && V[p.real] ? `${V[p.real]}km/h` : "";
  const res = BallSim.RESULTS[p.res] + (p.bip != null ? ` · ${BallSim.BIP[p.bip]}` : "");
  const last = k === simPA.pitches.length;
  const li = document.createElement("li");
  li.innerHTML = `<span class="no" style="background:${colors[p.type]}">${k}</span>
    <span class="what"><b>${esc(D.types[p.type])}</b> ${speed} → ${esc(res)}<small>${ZNAME[p.zone]}</small></span>
    <span class="cnt">${last ? esc(simPA.result) : `${b}-${s}`}</span>`;
  $("sim-log").appendChild(li);
  li.scrollIntoView({ block: "nearest" });
}
function showBanner() {
  const el = $("sim-banner"), r = simPA.result;
  const good = ["삼진", "땅볼", "플라이", "직선타"].includes(r);
  el.textContent = r + (good ? " 아웃" : "").replace("삼진 아웃", "삼진");
  el.style.background = good ? "var(--navy)" : "var(--accent)";
  el.hidden = false; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  $("sim-next").disabled = true;
}

function drawSim(tNow) {
  if (!simCtx || !simW || !D) return;
  const ctx = simCtx, w = simW, h = simH, cs = getComputedStyle(document.documentElement);
  const line = cs.getPropertyValue("--line").trim(), zone = cs.getPropertyValue("--zone").trim(), surface = cs.getPropertyValue("--surface").trim();
  ctx.clearRect(0, 0, w, h);
  const pr = projector("catcher", w, h);
  const [zb, zt] = D.meta.zone, hw = 17 / 24;
  const poly = (pts) => { ctx.beginPath(); pts.forEach((q, k) => { const [a, b] = pr(q); k ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); };
  ctx.strokeStyle = zone; ctx.lineWidth = 2;
  poly([[-hw, Y_PLATE, zb], [hw, Y_PLATE, zb], [hw, Y_PLATE, zt], [-hw, Y_PLATE, zt], [-hw, Y_PLATE, zb]]); ctx.stroke();
  ctx.strokeStyle = line; ctx.lineWidth = 1;
  for (let k = 1; k < 3; k++) {
    const x = -hw + 2 * hw * k / 3, z = zb + (zt - zb) * k / 3;
    poly([[x, Y_PLATE, zb], [x, Y_PLATE, zt]]); ctx.stroke(); poly([[-hw, Y_PLATE, z], [hw, Y_PLATE, z]]); ctx.stroke();
  }
  if (!simPA) return;
  const font = getComputedStyle(document.body).fontFamily;
  // 지나간 공: 홈플레이트 통과 위치에 번호
  simPA.pitches.slice(0, simStep).forEach((p, k) => {
    if (!p.params) return;
    const end = pathOf(p.params, 1); if (!end) return;
    const [x, y] = pr(end[end.length - 1]);
    ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fillStyle = colors[p.type]; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "700 11px " + font; ctx.textAlign = "center"; ctx.fillText(String(k + 1), x, y + 4);
  });
  // 날아가는 공
  if (tNow != null && simStep < simPA.pitches.length) {
    const p = simPA.pitches[simStep];
    if (p.params) {
      const pts = pathOf(p.params, 30, tNow); if (!pts) return;
      ctx.strokeStyle = colors[p.type]; ctx.lineWidth = 2; ctx.globalAlpha = 0.5; poly(pts); ctx.stroke(); ctx.globalAlpha = 1;
      const head = pts[pts.length - 1], [x, y] = pr(head);
      // 가까이 올수록 커 보이게
      const r = Math.max(3, Math.min(11, 340 / (head[1] + 20)));
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = colors[p.type]; ctx.stroke();
    }
  }
}

// 결과 요약: 시뮬레이션 결과나 실제 결과 개수 -> 지표
function summarize(counts, n, pitchesPerPA) {
  const c = (k) => counts[k] || 0;
  const h = HITS.reduce((a, k) => a + c(k), 0), bb = c("볼넷") + c("사구"), ab = n - bb;
  const tb = HITS.reduce((a, k) => a + c(k) * TB[k], 0);
  const value = Object.entries(counts).reduce((a, [k, v]) => a + v * (D.model.pa_value[PA_VALUE_KEY[k] || k] || 0), 0) / n;
  return { n, k: c("삼진") / n, bb: bb / n, hr: c("홈런") / n, avg: ab ? h / ab : 0, obp: (h + bb) / n, slg: ab ? tb / ab : 0, value, ppa: pitchesPerPA, counts };
}
function actualVs(pitcher, batter, stance) {
  const counts = {}; let n = 0, pitches = 0;
  for (let i = 0; i < N; i++) {
    if (P[i] !== pitcher || lefty(S[i]) !== stance || (batter >= 0 && B[i] !== batter)) continue;
    pitches++;
    if (R[i] < 0 || !(R[i] & 1)) continue;
    const pa = D.pa_results[R[i] >> 1], k = SAME_PA[pa] || pa;
    counts[k] = (counts[k] || 0) + 1; n++;
  }
  return n ? summarize(counts, n, pitches / n) : null;
}

function runBatch() {
  if (state.pitcher === "all") return;
  $("sim-out").innerHTML = `<div class="running">${fmt(sm.n)}타석 시뮬레이션 중…</div>`;
  setTimeout(() => {
    const sim = ensureSim(), seed = 20261024;
    const m = { pitcher: sm.pitcher, batter: sm.batter, stance: sm.stance };
    const t0 = performance.now();
    const base = sim.batch(m, sm.n, seed);
    const strat = sm.first >= 0 || sm.two >= 0;
    const alt = strat ? sim.batch({ ...m, strategy: { first: sm.first, two: sm.two } }, sm.n, seed) : null;
    const ms = performance.now() - t0;
    const sb = summarize(base.counts, base.n, base.pitchesPerPA), sa = alt && summarize(alt.counts, alt.n, alt.pitchesPerPA);
    const real = actualVs(sm.pitcher, -1, sm.stance), h2h = sm.batter >= 0 ? actualVs(sm.pitcher, sm.batter, sm.stance) : null;
    renderBatch(sb, sa, real, h2h, base, ms);
  }, 30);
}
function renderBatch(sb, sa, real, h2h, base, ms) {
  const main = sa || sb;
  const pc = (v) => (v * 100).toFixed(1) + "%", r3 = (v) => v.toFixed(3).replace(/^0/, "");
  // 투수 기준으로 좋으면 good: 삼진은 높을수록, 나머지는 낮을수록
  const diff = (key, fmtD, higherIsGood) => {
    if (!sa) return "";
    const d = sa[key] - sb[key], good = higherIsGood ? d > 0 : d < 0;
    return `<span class="d ${Math.abs(d) < 1e-9 ? "" : good ? "good" : "bad"}">${d >= 0 ? "+" : ""}${fmtD(d)} 가정 효과</span>`;
  };
  const kpi = (label, val, d) => `<div class="kpi"><i>${label}</i><b>${val}</b>${d}</div>`;
  const cols = [["시뮬레이션" + (sa ? " · 모델대로" : "") + (sm.batter >= 0 ? "" : " · 평균 타자"), sb]].concat(sa ? [["볼배합 가정", sa]] : [])
    .concat(real ? [[`실제 시즌 · ${sm.stance ? "좌타자" : "우타자"} 전체`, real]] : []).concat(h2h ? [[`실제 맞대결`, h2h]] : []);
  const rows = [["타석", (x) => fmt(x.n)], ["볼넷·사구 합계", (x) => pc(x.bb)],
    ["피안타율", (x) => r3(x.avg)], ["피출루율", (x) => r3(x.obp)], ["피장타율", (x) => r3(x.slg)], ["타석당 투구 수", (x) => x.ppa.toFixed(2)],
    ["타석당 기대 실점", (x) => (x.value >= 0 ? "+" : "") + x.value.toFixed(3)]];
  const outRows = OUTCOME_ORDER.map((k) => [k, (x) => pc((x.counts[k] || 0) / x.n)]);
  const ksum = base.strikeoutPitch.reduce((a, v) => a + v, 0);
  const kp = base.strikeoutPitch.map((v, t) => ({ t, v })).filter((x) => x.v).sort((a, b) => b.v - a.v).slice(0, 3);
  $("sim-out").innerHTML = `
    <div class="kpis">
      ${kpi("삼진", pc(main.k), diff("k", (d) => (d * 100).toFixed(1) + "%p", true))}
      ${kpi("볼넷·사구", pc(main.bb), diff("bb", (d) => (d * 100).toFixed(1) + "%p", false))}
      ${kpi("피안타율 / 피장타율", `${r3(main.avg)} / ${r3(main.slg)}`, diff("slg", (d) => d.toFixed(3), false))}
      ${kpi("타석당 기대 실점", (main.value >= 0 ? "+" : "") + main.value.toFixed(3), diff("value", (d) => (d >= 0 ? "+" : "") + d.toFixed(3), false))}
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th></th>${cols.map(([l]) => `<th>${esc(l)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(([l, f]) => `<tr><td>${l}</td>${cols.map(([, x]) => `<td>${f(x)}</td>`).join("")}</tr>`).join("")}
        <tr class="total"><td>타석 결과 분포</td>${cols.map(() => "<td></td>").join("")}</tr>
        ${outRows.map(([l, f]) => `<tr><td>${l}</td>${cols.map(([, x]) => `<td>${f(x)}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>
    <p class="caveat" style="margin:0">삼진을 잡은 공 (모델대로): ${kp.map((x) => `${esc(D.types[x.t])} ${(x.v / ksum * 100).toFixed(0)}%`).join(" · ") || "–"}
      · ${fmt(sb.n)}타석 ${sa ? "× 2 " : ""}계산 ${ms.toFixed(0)}ms. 기대 실점은 2026 기대 득점표로 매긴 타석 결과 가치의 평균이고, 음수일수록 투수에게 좋습니다.
      ${h2h && h2h.n < 30 ? `실제 맞대결은 ${h2h.n}타석뿐이라 우연의 영향이 큽니다.` : ""}</p>`;
}

/* ---------- 탭 ---------- */
const TABS = ["overview", "predict", "sim", "trajectory", "tunnel", "counts"];
let currentTab = "overview", trajAutoPlayed = false;
function panelOf(tab) { return $(tab === "counts" ? "counts-tab" : tab); }
function moveInk() {
  const btn = $("tab-" + currentTab), ink = $("tab-ink");
  if (!btn) return;
  ink.style.width = btn.offsetWidth + "px";
  ink.style.transform = `translateX(${btn.offsetLeft}px)`;
}
function showTab(tab, focus) {
  if (!TABS.includes(tab)) tab = "overview";
  currentTab = tab;
  for (const t of TABS) {
    const on = t === tab, btn = $("tab-" + t), panel = panelOf(t);
    btn.setAttribute("aria-selected", String(on)); btn.tabIndex = on ? 0 : -1;
    if (on && panel.hidden) { panel.hidden = false; panel.classList.remove("enter"); void panel.offsetWidth; panel.classList.add("enter"); }
    else if (!on) panel.hidden = true;
  }
  if (focus) $("tab-" + tab).focus();
  moveInk();
  if (tab === "predict") renderPredict();
  if (tab === "sim") renderSim();
  try { history.replaceState(null, "", "#" + tab); } catch (_) { /* 미리보기 등에서는 무시 */ }
  // 궤적 탭에 처음 들어오면 한 번 재생해서 무엇을 하는 화면인지 보여준다.
  if (tab === "trajectory" && !trajAutoPlayed && !REDUCED) {
    trajAutoPlayed = true;
    const team = trajTeam();
    if (team >= 0) ensureTraj(team).then(() => setTimeout(playTraj, 450));
  }
}
function bindTabs() {
  $("tablist").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
  $("tablist").addEventListener("keydown", (e) => {
    const k = TABS.indexOf(currentTab);
    if (e.key === "ArrowRight") showTab(TABS[(k + 1) % TABS.length], true);
    else if (e.key === "ArrowLeft") showTab(TABS[(k + TABS.length - 1) % TABS.length], true);
  });
  window.addEventListener("resize", moveInk);
  window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));
}

function update(pitcherChanged) {
  if (pitcherChanged) { tunBase = null; tunComp = null; }
  filter();
  const agg = aggregate();
  syncControls();
  renderHero(agg); renderInsights(agg); renderMix(agg); renderFinish(agg); renderCounts(agg); renderLegend(agg);
  animateZone();
  drawMove(); refreshTraj();
  renderPredict(); renderSim();
}

function onTheme() { if (!D) return; readColors(); update(); }
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

fetch("pitches.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((data) => {
  decode(data);
  readColors();
  shell();
  $("season").textContent = `${data.dates[0].slice(5).replace("-", ".")}~${data.dates[data.dates.length - 1].slice(5).replace("-", ".")} · ${fmt(data.meta.games)}경기 · ${fmt(N)}구`;
  fillTeams(); fillCounts(); fillMonths();
  // 첫 화면: 가장 많이 던진 투수
  let top = 0; for (let i = 1; i < pitchCount.length; i++) if (pitchCount[i] > pitchCount[top]) top = i;
  state.pitcher = String(top);
  setupZone(); setupTrajMove(); setupPredict(); setupSim();
  bindCombo(); bindFilters(); bindTabs();
  update(true);
  showTab(location.hash.slice(1) || "overview");
  requestAnimationFrame(moveInk);
}).catch((err) => {
  $("app").innerHTML = `<div class="loading"><div><b style="color:var(--ink)">투구 데이터(pitches.json)를 불러오지 못했습니다</b><br>${esc(err.message)} · 같은 폴더에서 <code>python -m http.server</code>로 열어 주세요.</div></div>`;
});
})();
</script>
