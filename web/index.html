<meta charset="utf-8">
<title>KBO 볼배합 탐색기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 바(검색) → 남색 선수 카드(지표·구종 막대) → 핵심 포인트 → 상황 필터 → 탭(개요 / 궤적·무브먼트 / 터널링 / 카운트). 색은 야구공의 남색 가죽과 빨간 실밥. */
:root {
  --bg: #edf0f4;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #0e1a2b;
  --muted: #556274;
  --faint: #8a95a5;
  --line: #d9dfe7;
  --accent: #d23f2a;
  --accent-soft: #fbe8e4;
  --navy: #13294b;
  --navy-2: #1c3763;
  --on-navy: #f3f6fb;
  --on-navy-muted: #a9b8d0;
  --zone: #0e1a2b;
  --shadow: 0 1px 2px rgb(14 26 43 / 0.06), 0 8px 24px rgb(14 26 43 / 0.06);
  --pt-ff: #e34948; --pt-ft: #eb6834; --pt-fc: #eda100; --pt-sl: #2a78d6;
  --pt-sw: #6250d6; --pt-cu: #008300; --pt-ch: #1baf7a; --pt-fo: #e87ba4; --pt-etc: #8a918c;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a111d; --surface: #111a2a; --surface-2: #16213a; --ink: #e7edf6; --muted: #9aa6b8; --faint: #66748a;
    --line: #243149; --accent: #ff6a55; --accent-soft: #3a1d1c; --navy: #13233d; --navy-2: #1b3156;
    --on-navy: #f3f6fb; --on-navy-muted: #9fb0cb; --zone: #e7edf6; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25);
    --pt-ff: #e66767; --pt-ft: #d95926; --pt-fc: #c98500; --pt-sl: #3987e5;
    --pt-sw: #9085e9; --pt-cu: #008300; --pt-ch: #199e70; --pt-fo: #d55181; --pt-etc: #7d857f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a111d; --surface: #111a2a; --surface-2: #16213a; --ink: #e7edf6; --muted: #9aa6b8; --faint: #66748a;
  --line: #243149; --accent: #ff6a55; --accent-soft: #3a1d1c; --navy: #13233d; --navy-2: #1b3156;
  --on-navy: #f3f6fb; --on-navy-muted: #9fb0cb; --zone: #e7edf6; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25);
  --pt-ff: #e66767; --pt-ft: #d95926; --pt-fc: #c98500; --pt-sl: #3987e5;
  --pt-sw: #9085e9; --pt-cu: #008300; --pt-ch: #199e70; --pt-fo: #d55181; --pt-etc: #7d857f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.wrap > * { min-width: 0; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 상단 바 */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 12px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: 0.01em; white-space: nowrap; }
.brand small { display: block; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick { display: flex; gap: 8px; flex-wrap: wrap; min-width: 0; }
.pick select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.combo { position: relative; width: min(320px, 100%); }
.combo input {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px 8px 34px; min-width: 0;
}
.combo input::placeholder { color: var(--faint); }
.combo .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.combo ul {
  position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; right: 0; max-height: 320px; overflow-y: auto;
  margin: 0; padding: 6px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
}
.combo li { display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
.combo li small { color: var(--muted); font-size: 12px; }
.combo li em { margin-left: auto; font-style: normal; font-family: var(--font-data); font-size: 11px; color: var(--faint); }
.combo li[aria-selected="true"], .combo li:hover { background: var(--accent-soft); }
.combo li.empty { color: var(--muted); cursor: default; background: none; }

/* 선수 카드 */
.hero {
  position: relative; overflow: hidden; border-radius: 18px; color: var(--on-navy);
  background: radial-gradient(120% 140% at 100% 0%, var(--navy-2) 0%, var(--navy) 55%);
  padding: 26px 28px 22px; display: grid; gap: 20px;
}
.hero .stitch { position: absolute; right: -60px; top: -40px; width: 360px; height: 360px; opacity: 0.55; pointer-events: none; }
.hero-top { position: relative; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 18px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: var(--on-navy-muted); }
.hero h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 6vw, 56px); line-height: 1; margin: 4px 0 0; letter-spacing: 0.01em; text-wrap: balance; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 6px; }
.badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: rgb(255 255 255 / 0.1); border: 1px solid rgb(255 255 255 / 0.16); white-space: nowrap; }
.badge.hand { background: var(--accent); border-color: transparent; color: #fff; }
.stats { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; border-top: 1px solid rgb(255 255 255 / 0.14); padding-top: 16px; }
@media (max-width: 900px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; } }
.stat { display: grid; gap: 2px; padding-right: 12px; min-width: 0; }
.stat b { font-family: var(--font-data); font-weight: 600; font-size: clamp(20px, 2.6vw, 28px); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat b small { font-size: 0.5em; font-weight: 500; color: var(--on-navy-muted); margin-left: 3px; }
.stat i { font-style: normal; font-size: 12px; color: var(--on-navy-muted); }
.arsenal { position: relative; display: grid; gap: 8px; }
.arsenal-bar { display: flex; gap: 3px; height: 14px; }
.arsenal-bar span { height: 100%; border-radius: 3px; min-width: 3px; transition: flex-grow 0.6s var(--ease); cursor: default; }
.arsenal-keys { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--on-navy-muted); }
.arsenal-keys span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.arsenal-keys i { width: 8px; height: 8px; border-radius: 50%; }
.arsenal-keys b { color: var(--on-navy); font-family: var(--font-data); font-weight: 500; }

/* 핵심 포인트 */
.insights { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1000px) { .insights { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .insights { grid-template-columns: minmax(0, 1fr); } }
.insight { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.insight .k { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.04em; }
.insight .v { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
.insight .v i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.insight .d { font-size: 13px; color: var(--muted); }
.insight .d b { color: var(--ink); font-family: var(--font-data); font-weight: 600; }

/* 상황 필터 */
.filterbar { display: grid; gap: 10px; }
.quick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.qchip, .more {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.15s;
}
.qchip:hover, .more:hover { border-color: var(--accent); }
.qchip:active, .more:active { transform: scale(0.97); }
.qchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.more { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.more .n { background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; line-height: 18px; }
.more svg { transition: transform 0.25s var(--ease); }
.more[aria-expanded="true"] svg { transform: rotate(180deg); }
.active { display: flex; flex-wrap: wrap; gap: 6px; }
.achip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 6px 4px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); border: 0; cursor: pointer; }
.achip span { color: var(--muted); }
.achip svg { opacity: 0.6; }
.achip:hover svg { opacity: 1; }
.drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.35s var(--ease); }
.drawer[data-open="true"] { grid-template-rows: 1fr; }
.drawer > div { overflow: hidden; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 2px; }
.field { display: grid; gap: 5px; min-width: 0; align-content: start; }
.field label, .flabel { font-size: 12px; font-weight: 600; color: var(--muted); }
.field select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; width: 100%; min-width: 0; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface-2); min-width: 0; }
.seg button { flex: 1; font-size: 13px; padding: 6px 8px; border: 0; background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; transition: background 0.2s, color 0.2s; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
.reset { font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; justify-self: start; align-self: end; font-weight: 600; }

/* 탭 */
@media (max-width: 760px) { .topbar { position: static; } .tabs { position: static !important; } }
.tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 15; overflow-x: auto; scrollbar-width: none; background: var(--bg); }
.tabs::-webkit-scrollbar { display: none; }
.tablist { position: relative; display: flex; gap: 4px; border-bottom: 1px solid var(--line); min-width: max-content; }
.tab { position: relative; padding: 10px 14px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; transition: color 0.2s; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab-ink { position: absolute; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); transition: transform 0.35s var(--ease), width 0.35s var(--ease); left: 0; }
.tabpanel { display: grid; gap: 18px; }
.tabpanel.enter { animation: rise 0.4s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* 패널 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.panel h2 { font-size: 16px; font-weight: 700; margin: 0 0 2px; }
.panel .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; max-width: 72ch; }
.grid2 { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 18px; }
.grid2b { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 1040px) { .grid2, .grid2b { grid-template-columns: minmax(0, 1fr); } }
.stackcol { display: grid; gap: 18px; align-content: start; min-width: 0; }
.phead { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 16px; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; }
.ctrls .seg button { padding: 5px 10px; font-size: 12px; }
.canvas-box { position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; }
.canvas-box canvas, .zone-box canvas { width: 100%; height: 100%; display: block; }
.zone-box { position: relative; width: 100%; max-width: 360px; aspect-ratio: 5 / 5.4; margin: 0 auto; }
.mini { margin-top: 12px; }
.play { display: flex; gap: 6px; align-items: stretch; }
.playbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 5px 14px; cursor: pointer; white-space: nowrap; transition: transform 0.15s, filter 0.2s; }
.playbtn:hover { filter: brightness(1.08); }
.playbtn:active { transform: scale(0.96); }
.tun-base { min-width: 160px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 8px; cursor: pointer; transition: opacity 0.2s, transform 0.15s; }
.chip:active { transform: scale(0.96); }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; transition: background 0.2s; }
.chip[aria-pressed="false"] { color: var(--faint); }
.chip[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--faint); }
.chip em { font-style: normal; font-family: var(--font-data); color: var(--muted); font-size: 11px; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: right; font-size: 12px; font-weight: 600; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--line); font-family: var(--font-data); font-size: 13px; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; font-family: var(--font-body); }
tbody tr { transition: background 0.15s; }
tbody tr:hover td { background: var(--surface-2); }
td .tname { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
td .tname i { width: 10px; height: 10px; border-radius: 50%; }
.bar { display: inline-block; vertical-align: middle; height: 6px; border-radius: 3px; margin-right: 8px; transition: width 0.5s var(--ease); }
tr:last-child td { border-bottom: 0; }
tr.total td { font-weight: 700; border-top: 1px solid var(--line); background: var(--surface-2); }
#tuntable tbody tr { cursor: pointer; }
#tuntable tbody tr[aria-selected="true"] td { background: var(--accent-soft); }

.counts { display: grid; gap: 5px; }
.crow { display: grid; grid-template-columns: 52px minmax(0, 1fr) 60px; gap: 12px; align-items: center; }
.crow .lab { font-family: var(--font-data); font-size: 14px; font-weight: 600; }
.crow .n { font-family: var(--font-data); font-size: 12px; color: var(--muted); text-align: right; }
.stack { display: flex; gap: 2px; height: 26px; }
.stack .seg2 { height: 100%; min-width: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-data); font-size: 11px; font-weight: 600; color: #fff; overflow: hidden; cursor: default; transition: flex-grow 0.5s var(--ease), filter 0.15s; }
.stack .seg2:hover { filter: brightness(1.1); }
.stack .seg2:first-child { border-radius: 6px 0 0 6px; }
.stack .seg2:last-child { border-radius: 0 6px 6px 0; }
.stack .seg2:only-child { border-radius: 6px; }
.stack.empty { background: var(--surface-2); border-radius: 6px; }
.cgroup { font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: 0.06em; margin-top: 10px; }
.cgroup:first-child { margin-top: 0; }

/* 다음 공 예측 */
.pred { display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1040px) { .pred { grid-template-columns: minmax(0, 1fr); } }
.pred-set { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 120px); }
@media (max-width: 1040px) { .pred-set { position: static; } }
.pred-set .field select { background: var(--surface-2); }
.countgrid { display: grid; grid-template-columns: 34px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.countgrid .hd { font-size: 11px; color: var(--faint); text-align: center; font-weight: 600; }
.countgrid button { font-family: var(--font-data); font-weight: 600; font-size: 13px; padding: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; transition: background 0.15s, color 0.15s, transform 0.1s; }
.countgrid button:active { transform: scale(0.95); }
.countgrid button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.chips .chip:disabled { opacity: 0.45; cursor: not-allowed; }
.pred-out { display: grid; gap: 18px; min-width: 0; }
.pred-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; }
.pred-top .big { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1; display: inline-flex; align-items: center; gap: 10px; }
.pred-top .big i { width: 14px; height: 14px; border-radius: 50%; }
.pred-top .pv { font-family: var(--font-data); font-size: 28px; font-weight: 600; }
.pbars { display: grid; gap: 8px; }
.pbar { display: grid; grid-template-columns: 76px minmax(0, 1fr) 56px; gap: 10px; align-items: center; font-size: 13px; }
.pbar .nm { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pbar .nm i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.pbar .track { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.pbar .fill { height: 100%; border-radius: 6px; width: 0; transition: width 0.55s var(--ease); }
.pbar .v { font-family: var(--font-data); text-align: right; font-weight: 600; }
.evidence { margin-top: 14px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.evidence b { color: var(--ink); font-family: var(--font-data); font-weight: 600; }
.evidence .arr { color: var(--faint); }
.zonewrap { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); gap: 18px; align-items: center; }
@media (max-width: 640px) { .zonewrap { grid-template-columns: minmax(0, 1fr); } }
.zonemap { width: 100%; max-width: 300px; margin: 0 auto; display: block; }
.zonemap .cell { transition: fill-opacity 0.45s var(--ease); }
.zonemap text { font-family: var(--font-data); font-size: 11px; font-weight: 600; pointer-events: none; }
.zone-notes { font-size: 13px; color: var(--muted); display: grid; gap: 6px; }
.zone-notes b { color: var(--ink); }
.vtable td.best { position: relative; }
.vbar { display: inline-block; height: 8px; border-radius: 4px; vertical-align: middle; margin-left: 8px; transition: width 0.5s var(--ease); }

const PA_GROUPS = {
  so: ["삼진"], bb: ["볼넷", "고의4구", "사구"], hit: ["1루타", "2루타", "3루타", "홈런"], xbh: ["2루타", "3루타", "홈런"], hr: ["홈런"],
  out: ["땅볼", "플라이", "라인드라이브", "병살타"], gb: ["땅볼", "병살타"], fb: ["플라이", "라인드라이브"],
};
const RESULT_LABEL = { B: "볼", T: "루킹 스트라이크", S: "헛스윙", F: "파울", H: "인플레이", W: "번트 파울", V: "번트 헛스윙" };
const COUNTS = [];
for (let b = 0; b <= 3; b++) for (let s = 0; s <= 2; s++) COUNTS.push([b, s]);
const COUNT_GROUPS = {
  first: { label: "초구 (0-0)", test: (b, s) => b === 0 && s === 0 },
  ahead: { label: "투수 유리 (0-1, 0-2, 1-2)", test: (b, s) => s > b && s > 0 },
  behind: { label: "타자 유리 (1-0, 2-0, 3-0, 2-1, 3-1)", test: (b, s) => b > s },
  even: { label: "동카운트 (1-1, 2-2)", test: (b, s) => b === s && b > 0 },
  two: { label: "2스트라이크", test: (b, s) => s === 2 },
  full: { label: "풀카운트 (3-2)", test: (b, s) => b === 3 && s === 2 },
};
const DEFAULTS = { stance: "all", count: "all", runner: "all", outs: "all", score: "all", month: "all", round: "all", scope: "all", pa: "all" };
// 한 번에 거는 상황 조건. 같은 키를 쓰는 조건끼리는 서로 바뀐다.
const PRESETS = [
  { id: "first", label: "초구", set: { count: "first" } },
  { id: "two", label: "2스트라이크", set: { count: "two" } },
  { id: "behind", label: "타자 유리 카운트", set: { count: "behind" } },
  { id: "risp", label: "득점권", set: { runner: "risp" } },
  { id: "putaway", label: "결정구", set: { scope: "last" } },
  { id: "kpitch", label: "삼진 잡은 공", set: { scope: "last", pa: "so" } },
];
const PRESET_KEYS = [...new Set(PRESETS.flatMap((p) => Object.keys(p.set)))];
const FILTER_LABEL = { stance: "타석", count: "카운트", runner: "주자", outs: "아웃", score: "점수", month: "기간", round: "구분", scope: "범위", pa: "타석 결과" };
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("ko-KR");
const pct = (a, b) => (b ? (100 * a / b) : 0);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON_X = `<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;

let D, N, P, B, T, V, X, Z, S, DT, R, MX, MZ, MONTH, pitchCount;
let colors = [];
const state = { team: "all", pitcher: "all", ...DEFAULTS, hidden: new Set() };
let sel = new Uint32Array(0);

function readColors() {
  const cs = getComputedStyle(document.documentElement);
  colors = D.types.map((t) => cs.getPropertyValue(TYPE_VAR[t] || "--pt-etc").trim());
}

function decode(data) {
  D = data; N = data.meta.count;
  const c = data.cols;
  P = Uint32Array.from(c.p); B = Uint32Array.from(c.b); T = Uint8Array.from(c.t);
  V = Uint16Array.from(c.v, (v) => v ?? 0);
  X = Int16Array.from(c.x, (v) => v ?? -32768); Z = Int16Array.from(c.z, (v) => v ?? -32768);
  S = Uint16Array.from(c.s); DT = Uint16Array.from(c.d);
  R = Int16Array.from(c.r, (v) => v ?? -1);  // 타석 결과*2 + 결정구, 없으면 -1
  MX = Int16Array.from(c.mx, (v) => v ?? -32768); MZ = Int16Array.from(c.mz, (v) => v ?? -32768);
  const months = [...new Set(data.dates.map((d) => d.slice(0, 7)))];
  const monthIdx = data.dates.map((d) => months.indexOf(d.slice(0, 7)));
  MONTH = { list: months, of: Uint8Array.from(DT, (d) => monthIdx[d]) };
  pitchCount = new Uint32Array(data.pitchers.length);
  for (let i = 0; i < N; i++) pitchCount[P[i]]++;
}

const balls = (s) => s & 3, strikes = (s) => (s >> 2) & 3, outs = (s) => (s >> 4) & 3;
const bases = (s) => (s >> 6) & 7, lefty = (s) => (s >> 9) & 1, result = (s) => (s >> 10) & 15, post = (s) => (s >> 14) & 1;

function filter() {
  const out = new Uint32Array(N);
  let k = 0;
  const teamIdx = state.team === "all" ? -1 : +state.team;
  const pit = state.pitcher === "all" ? -1 : +state.pitcher;
  const st = state.stance === "all" ? -1 : (state.stance === "L" ? 1 : 0);
  const cnt = state.count;
  const grp = COUNT_GROUPS[cnt];
  const single = cnt.includes("-") ? cnt.split("-").map(Number) : null;
  const o = state.outs === "all" ? -1 : +state.outs;
  const mo = state.month === "all" ? -1 : +state.month;
  const rd = state.round;
  const sc = state.score;
  const pTeam = D.pitchers.map((p) => p[1]);
  const diff = D.cols.sd;  // 점수차는 null이 있어 원본 배열 그대로 사용
  const lastOnly = state.scope === "last";
  const paSet = state.pa === "all" ? null : new Set(PA_GROUPS[state.pa].map((x) => D.pa_results.indexOf(x)));
  for (let i = 0; i < N; i++) {
    const s = S[i];
    if (pit >= 0) { if (P[i] !== pit) continue; }
    else if (teamIdx >= 0 && pTeam[P[i]] !== teamIdx) continue;
    if (st >= 0 && lefty(s) !== st) continue;
    if (o >= 0 && outs(s) !== o) continue;
    if (mo >= 0 && MONTH.of[i] !== mo) continue;
    if (lastOnly && (R[i] < 0 || !(R[i] & 1))) continue;
    if (paSet && (R[i] < 0 || !paSet.has(R[i] >> 1))) continue;
    if (rd === "reg" && post(s)) continue;
    if (rd === "post" && !post(s)) continue;
    if (cnt !== "all") {
      const b = balls(s), k2 = strikes(s);
      if (single ? (b !== single[0] || k2 !== single[1]) : !grp.test(b, k2)) continue;
    }
    if (state.runner !== "all") {
      const bs = bases(s);
      if (state.runner === "none" && bs !== 0) continue;
      if (state.runner === "on" && bs === 0) continue;
      if (state.runner === "risp" && (bs & 6) === 0) continue;
      if (state.runner === "1b" && bs !== 1) continue;
      if (state.runner === "full" && bs !== 7) continue;
    }
    if (sc !== "all" && diff) {
      const d = diff[i];
      if (d === null) continue;
      if (sc === "close" && Math.abs(d) > 2) continue;
      if (sc === "lead" && d <= 0) continue;
      if (sc === "tie" && d !== 0) continue;
      if (sc === "trail" && d >= 0) continue;
    }
    out[k++] = i;
  }
  sel = out.subarray(0, k);
}

/* ---------- 투수 선택 ---------- */
function fillTeams() {
  $("f-team").innerHTML = [`<option value="all">전체 구단</option>`].concat(
    D.teams.map((t, i) => [t, i]).sort((a, b) => a[0].localeCompare(b[0], "ko")).map(([t, i]) => `<option value="${i}">${esc(t)}</option>`)).join("");
}
let comboItems = [], comboActive = -1;
function pitcherLabel() {
  if (state.pitcher !== "all") return D.pitchers[+state.pitcher][0];
  return "";
}
function comboOpen(query) {
  const q = query.trim();
  const teamIdx = state.team === "all" ? -1 : +state.team;
  const list = D.pitchers.map((p, i) => ({ i, name: p[0], team: p[1], n: pitchCount[i] }))
    .filter((p) => p.n > 0 && (q ? p.name.includes(q) : (teamIdx < 0 || p.team === teamIdx)))
    .sort((a, b) => b.n - a.n).slice(0, 60);
  const all = { i: "all", name: teamIdx < 0 ? "리그 전체 투수" : `${D.teams[teamIdx]} 투수 전체` };
  comboItems = q ? list : [all, ...list];
  comboActive = comboItems.findIndex((x) => String(x.i) === state.pitcher);
  const ul = $("p-list");
  ul.innerHTML = comboItems.length ? comboItems.map((x, k) => `<li role="option" id="p-opt-${k}" data-k="${k}" aria-selected="${k === comboActive}">
      ${esc(x.name)}${x.team != null ? `<small>${esc(D.teams[x.team])}${D.pitchers[x.i][2] ? " · " + (D.pitchers[x.i][2] === "L" ? "좌투" : "우투") : ""}</small><em>${fmt(x.n)}구</em>` : ""}</li>`).join("")
    : `<li class="empty">“${esc(q)}” 투수를 찾지 못했습니다</li>`;
  ul.hidden = false; $("p-search").setAttribute("aria-expanded", "true");
  scrollActive();
}
function comboClose() { $("p-list").hidden = true; $("p-search").setAttribute("aria-expanded", "false"); $("p-search").value = pitcherLabel(); }
function scrollActive() {
  for (const li of $("p-list").querySelectorAll("li[data-k]")) li.setAttribute("aria-selected", String(+li.dataset.k === comboActive));
  const el = $("p-opt-" + comboActive);
  if (el) { el.scrollIntoView({ block: "nearest" }); $("p-search").setAttribute("aria-activedescendant", el.id); }
}
function comboPick(k) {
  const x = comboItems[k]; if (!x) return;
  state.pitcher = String(x.i);
  if (x.team != null && state.team !== "all" && +state.team !== x.team) state.team = "all";
  $("f-team").value = state.team;
  comboClose(); $("p-search").blur(); update(true);
}
function bindCombo() {
  const input = $("p-search");
  input.addEventListener("focus", () => { input.select(); comboOpen(""); });
  input.addEventListener("input", () => comboOpen(input.value));
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); if ($("p-list").hidden) comboOpen(input.value); comboActive = Math.min(comboItems.length - 1, comboActive + 1); scrollActive(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); comboActive = Math.max(0, comboActive - 1); scrollActive(); }
    else if (e.key === "Enter") { e.preventDefault(); comboPick(comboActive < 0 ? 0 : comboActive); }
    else if (e.key === "Escape") { comboClose(); input.blur(); }
  });
  $("p-list").addEventListener("mousedown", (e) => { const li = e.target.closest("li[data-k]"); if (li) { e.preventDefault(); comboPick(+li.dataset.k); } });
  input.addEventListener("blur", () => setTimeout(comboClose, 120));
  $("f-team").addEventListener("change", (e) => { state.team = e.target.value; state.pitcher = "all"; $("p-search").value = ""; update(true); });
}

/* ---------- 상황 필터 ---------- */
function fillCounts() {
  $("f-count").innerHTML = [`<option value="all">전체</option>`, `<optgroup label="상황">`]
    .concat(Object.entries(COUNT_GROUPS).map(([k, g]) => `<option value="${k}">${g.label}</option>`))
    .concat([`</optgroup><optgroup label="카운트 (볼-스트라이크)">`])
    .concat(COUNTS.map(([b, s]) => `<option value="${b}-${s}">${b}-${s}</option>`)).concat(["</optgroup>"]).join("");
}
function fillMonths() {
  $("f-month").innerHTML = [`<option value="all">시즌 전체</option>`]
    .concat(MONTH.list.map((m, i) => `<option value="${i}">${+m.slice(5)}월</option>`)).join("");
}
function filterText(k) {
  const v = state[k];
  if (k === "stance") return v === "L" ? "좌타" : "우타";
  if (k === "outs") return `${v}아웃`;
  if (k === "scope") return "결정구만";
  const el = $("f-" + k), opt = el && [...el.options].find((o) => o.value === v);
  return opt ? opt.textContent : v;
}
function syncControls() {
  for (const k of ["count", "runner", "score", "month", "round", "pa"]) $("f-" + k).value = state[k];
  for (const k of ["stance", "outs", "scope"]) for (const b of $("f-" + k).querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === state[k]));
  $("f-team").value = state.team;
  if (document.activeElement !== $("p-search")) $("p-search").value = pitcherLabel();
  // 빠른 조건은 그 조건이 건드리는 값이 모두 그 조건과 같을 때만 켜진 것으로 본다
  for (const b of $("quick").querySelectorAll("[data-preset]")) {
    const p = PRESETS.find((x) => x.id === b.dataset.preset);
    b.setAttribute("aria-pressed", String(PRESET_KEYS.every((k) => state[k] === (p.set[k] ?? DEFAULTS[k]))));
  }
  const act = Object.keys(DEFAULTS).filter((k) => state[k] !== DEFAULTS[k]);
  $("active").innerHTML = act.map((k) => `<button type="button" class="achip" data-k="${k}" aria-label="${FILTER_LABEL[k]} 조건 지우기"><span>${FILTER_LABEL[k]}</span>${esc(filterText(k))}${ICON_X}</button>`).join("");
  $("more-n").hidden = !act.length; $("more-n").textContent = act.length;
}
function bindFilters() {
  for (const k of ["count", "runner", "score", "month", "round", "pa"]) $("f-" + k).addEventListener("change", (e) => { state[k] = e.target.value; update(); });
  for (const k of ["stance", "outs", "scope"]) $("f-" + k).addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state[k] = b.dataset.v; update();
  });
  $("quick").addEventListener("click", (e) => {
    const b = e.target.closest("[data-preset]"); if (!b) return;
    const p = PRESETS.find((x) => x.id === b.dataset.preset);
    const wasOn = b.getAttribute("aria-pressed") === "true";
    // 다른 빠른 조건을 지우고 이것만 건다. 이미 켜져 있으면 끈다.
    for (const q of PRESETS) for (const k of Object.keys(q.set)) state[k] = DEFAULTS[k];
    if (!wasOn) Object.assign(state, p.set);
    update();
  });
  $("more").addEventListener("click", () => {
    const open = $("drawer").dataset.open !== "true";
    $("drawer").dataset.open = String(open); $("more").setAttribute("aria-expanded", String(open));
  });
  $("active").addEventListener("click", (e) => { const c = e.target.closest(".achip"); if (c) { state[c.dataset.k] = DEFAULTS[c.dataset.k]; update(); } });
  $("reset").addEventListener("click", () => { Object.assign(state, DEFAULTS); state.hidden.clear(); update(); });
}

/* ---------- 집계 ---------- */
function aggregate() {
  const nt = D.types.length;
  const by = Array.from({ length: nt }, () => ({ n: 0, vSum: 0, vN: 0, vMax: 0, strike: 0, swing: 0, whiff: 0 }));
  const byCount = COUNTS.map(() => new Uint32Array(nt));
  const fin = Array.from({ length: nt }, () => new Uint32Array(D.pa_results.length));
  for (const i of sel) {
    const t = T[i], s = S[i], a = by[t];
    a.n++;
    if (V[i]) { a.vSum += V[i]; a.vN++; if (V[i] > a.vMax) a.vMax = V[i]; }
    const r = D.results[result(s)];
    if (r && r !== "B") a.strike++;
    if (r === "S" || r === "F" || r === "H" || r === "W" || r === "V") a.swing++;
    if (r === "S" || r === "V") a.whiff++;
    byCount[balls(s) * 3 + strikes(s)][t]++;
    if (R[i] >= 0 && (R[i] & 1)) fin[t][R[i] >> 1]++;
  }
  return { by, byCount, fin };
}
function finLine(arr) {
  const idx = (names) => names.map((n) => D.pa_results.indexOf(n));
  const sum = (ids) => ids.reduce((a, i) => a + arr[i], 0);
  const pa = arr.reduce((a, v) => a + v, 0);
  const h = sum(idx(["1루타", "2루타", "3루타", "홈런"]));
  const ab = pa - sum(idx(["볼넷", "고의4구", "사구", "희생번트", "희생플라이"]));
  return { pa, k: sum(idx(["삼진"])), bb: sum(idx(["볼넷", "고의4구", "사구"])), h, xb: sum(idx(["2루타", "3루타", "홈런"])), ab };
}
const avgStr = (h, ab) => ab ? (h / ab).toFixed(3).replace(/^0/, "") : "–";

/* ---------- 숫자 올라가는 효과 ---------- */
function countTo(el, to, decimals = 0, suffix = "") {
  const from = el._v ?? 0;
  el._v = to;
  const show = (v) => { el.innerHTML = (Number.isFinite(v) ? (decimals ? v.toFixed(decimals) : fmt(Math.round(v))) : "–") + suffix; };
  if (!Number.isFinite(to) || REDUCED || from === to) return show(to);
  const start = performance.now(), dur = 550;
  const step = (now) => {
    const k = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - k, 3);
    show(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- 스트라이크존 ---------- */
const XR = [-2.5, 2.5], ZR = [-0.2, 5.2];
let zoneCtx, zoneW = 0, zoneH = 0, zonePts = [], zoneAnim = 0;
function setupZone() {
  const box = $("zonebox"), cv = $("zone");
  zoneCtx = cv.getContext("2d");
  new ResizeObserver(() => {
    const r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    zoneW = r.width; zoneH = r.height;
    cv.width = Math.round(zoneW * dpr); cv.height = Math.round(zoneH * dpr);
    zoneCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawZone();
  }).observe(box);
  cv.addEventListener("mousemove", zoneHover);
  cv.addEventListener("mouseleave", hideTip);
  $("legend").addEventListener("click", (e) => {
    const c = e.target.closest(".chip"); if (!c) return;
    const t = +c.dataset.t;
    state.hidden.has(t) ? state.hidden.delete(t) : state.hidden.add(t);
    c.setAttribute("aria-pressed", String(!state.hidden.has(t)));
    drawZone(); drawTraj(); drawMove();
  });
}
const sx = (x) => (x - XR[0]) / (XR[1] - XR[0]) * zoneW;
const sz = (z) => zoneH - (z - ZR[0]) / (ZR[1] - ZR[0]) * zoneH;

// 필터가 바뀌면 점이 존 중심에서 제자리로 퍼지며 나타난다.
function animateZone() {
  cancelAnimationFrame(zoneAnim);
  if (REDUCED) return drawZone();
  const start = performance.now(), dur = 520;
  const step = (now) => {
    const k = Math.min(1, (now - start) / dur);
    drawZone(1 - Math.pow(1 - k, 3));
    if (k < 1) zoneAnim = requestAnimationFrame(step);
  };
  zoneAnim = requestAnimationFrame(step);
}
function drawZone(progress = 1) {
  if (!zoneCtx || !zoneW) return;
  const ctx = zoneCtx, cs = getComputedStyle(document.documentElement);
  const ink = cs.getPropertyValue("--zone").trim(), faint = cs.getPropertyValue("--line").trim(), surface = cs.getPropertyValue("--surface").trim(), muted = cs.getPropertyValue("--muted").trim();
  ctx.clearRect(0, 0, zoneW, zoneH);
  const [zb, zt] = D.meta.zone, hw = 17 / 24;
  ctx.strokeStyle = faint; ctx.lineWidth = 1;
  for (let k = 1; k < 3; k++) {
    const x = -hw + (2 * hw) * k / 3, z = zb + (zt - zb) * k / 3;
    ctx.beginPath(); ctx.moveTo(sx(x), sz(zb)); ctx.lineTo(sx(x), sz(zt)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx(-hw), sz(z)); ctx.lineTo(sx(hw), sz(z)); ctx.stroke();
  }
  const py = sz(0.05);
  ctx.fillStyle = faint;
  ctx.beginPath(); ctx.moveTo(sx(-hw), py); ctx.lineTo(sx(hw), py); ctx.lineTo(sx(hw), py + 5); ctx.lineTo(sx(0), py + 12); ctx.lineTo(sx(-hw), py + 5); ctx.closePath(); ctx.fill();

  const pts = [];
  for (const i of sel) {
    if (X[i] === -32768 || Z[i] === -32768 || state.hidden.has(T[i])) continue;
    pts.push(i);
  }
  zonePts = pts;
  const many = pts.length > 4000;
  const r = pts.length > 20000 ? 2 : pts.length > 4000 ? 2.6 : 4.4;
  const cx = sx(0), cz = sz((zb + zt) / 2);
  ctx.globalAlpha = (pts.length > 20000 ? 0.28 : pts.length > 4000 ? 0.5 : 0.85) * progress;
  for (const i of pts) {
    const x = cx + (sx(X[i] / 100) - cx) * progress, y = cz + (sz(Z[i] / 100) - cz) * progress;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = colors[T[i]]; ctx.fill();
    if (!many) { ctx.lineWidth = 1; ctx.strokeStyle = surface; ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = ink; ctx.lineWidth = 2;
  ctx.strokeRect(sx(-hw), sz(zt), sx(hw) - sx(-hw), sz(zb) - sz(zt));
  ctx.fillStyle = muted; ctx.font = "12px " + getComputedStyle(document.body).fontFamily;
  ctx.textAlign = "left"; ctx.fillText(`${fmt(pts.length)}구`, 6, 16);
}
function zoneHover(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let best = -1, bd = 64;
  for (const i of zonePts) {
    const dx = sx(X[i] / 100) - mx, dy = sz(Z[i] / 100) - my, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = i; }
  }
  if (best < 0) return hideTip();
  const s = S[best], p = D.pitchers[P[best]], b = D.batters[B[best]];
  const bs = bases(s);
  const runners = bs ? ["1", "2", "3"].filter((_, k) => bs >> k & 1).join("·") + "루" : "주자 없음";
  const pa = R[best] >= 0 ? `<br>타석 결과: <b>${esc(D.pa_results[R[best] >> 1])}</b>${R[best] & 1 ? " (결정구)" : ""}` : "";
  showTip(e.clientX, e.clientY, `<b>${esc(D.types[T[best]])} ${V[best] || "–"}km/h</b> · ${RESULT_LABEL[D.results[result(s)]] || "–"}${pa}<br>
    ${esc(p[0])} → ${esc(b[0])} (${lefty(s) ? "좌" : "우"}타)<br>
    <span class="m">${balls(s)}-${strikes(s)} · ${outs(s)}아웃 · ${runners}<br>${D.dates[DT[best]]}</span>`);
}

const tip = $("tip");
function showTip(x, y, html) {
  tip.innerHTML = html; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 14, top = y + 14;
  if (left + w > window.innerWidth - 8) left = x - w - 14;
  if (top + h > window.innerHeight - 8) top = y - h - 14;
  tip.style.left = Math.max(8, left) + "px"; tip.style.top = Math.max(8, top) + "px";
}
function hideTip() { tip.hidden = true; }
document.addEventListener("mouseover", (e) => {

/* ---------- 투구 궤적 ---------- */
// 궤적 파라미터 [x0, z0, vx0, vy0, vz0, ax, ay, az, y0]. 위치 = r0 + v0 t + a t^2 / 2
// y0(측정 시작 지점)는 2026년 7월 중순 50ft에서 55ft로 바뀌어 공마다 다르다.
const TK = ["x0", "z0", "vx0", "vy0", "vz0", "ax", "ay", "az", "y0"], NP = TK.length;
const Y_PLATE = 17 / 12, Y_RELEASE = 54.5, Y_RUBBER = 60.5;
let TR = null;  // Float32Array(N * NP), 아직 안 불러온 투구는 NaN
const trajLoaded = new Map();
let trajView = "catcher", trajMode = "avg", trajStatus = "", trajSpeed = 0.25, anim = null;
let tunBase = null, tunComp = null, tunCtx, tunW = 0, tunH = 0, sepCtx, sepW = 0, sepH = 0;
const DECISION = 0.167;  // 타자 판단 시점: 홈 도착 0.167초 전
let trajCtx, trajW = 0, trajH = 0, moveCtx, moveW = 0, moveH = 0, moveMeans = [];

function setupCanvas(boxId, canvasId, onSize) {

}
function setupTrajMove() {
  setupCanvas("trajbox", "traj", (ctx, w, h) => { trajCtx = ctx; trajW = w; trajH = h; drawTraj(); });
  setupCanvas("movebox", "move", (ctx, w, h) => { moveCtx = ctx; moveW = w; moveH = h; drawMove(); });
  for (const [id, set] of [["traj-view", (v) => trajView = v], ["traj-mode", (v) => trajMode = v], ["traj-speed", (v) => trajSpeed = +v]]) {
    $(id).addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      set(b.dataset.v);
      for (const x of $(id).querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
      if (id === "traj-speed") playTraj(); else { stopAnim(); drawTraj(); }
    });
  }
  $("traj-play").addEventListener("click", playTraj);
  setupCanvas("tunbox", "tun", (ctx, w, h) => { tunCtx = ctx; tunW = w; tunH = h; drawTunnel(); });
  setupCanvas("sepbox", "sep", (ctx, w, h) => { sepCtx = ctx; sepW = w; sepH = h; drawTunnel(); });
  $("tun-base").addEventListener("change", (e) => { tunBase = +e.target.value; tunComp = null; drawTunnel(); });
  $("tuntable").addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-t]"); if (!tr) return;
    tunComp = +tr.dataset.t; drawTunnel();
  });
  $("move").addEventListener("mousemove", moveHover);
  $("move").addEventListener("mouseleave", hideTip);
}

function trajTeam() {
  if (state.pitcher !== "all") return D.pitchers[+state.pitcher][1];
  return state.team === "all" ? -1 : +state.team;
}
function ensureTraj(team) {
  if (!trajLoaded.has(team)) {
    const pr = fetch(`traj/${team}.json`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((t) => {
      if (!TR) TR = new Float32Array(N * NP).fill(NaN);
      t.i.forEach((gi, k) => { for (let j = 0; j < NP; j++) TR[gi * NP + j] = t[TK[j]][k] / 100; });
    });
    pr.catch(() => trajLoaded.delete(team));
    trajLoaded.set(team, pr);
  }
  return trajLoaded.get(team);
}
function refreshTraj() {
  stopAnim();
  const team = trajTeam();
  const redraw = () => { drawTraj(); drawTunnel(); };
  if (team < 0) { trajStatus = "팀이나 투수를 고르면 궤적을 그립니다."; return redraw(); }
  trajStatus = "궤적 데이터를 불러오는 중…"; redraw();
  ensureTraj(team).then(() => { trajStatus = ""; redraw(); }, () => { trajStatus = "궤적 데이터를 불러오지 못했습니다."; redraw(); });
}

/* 재생: 릴리스 이후 경과 시간(초)만큼만 궤적을 그린다. 구종마다 실제 비행 시간대로 도착한다. */
function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
function playTraj() {
  stopAnim();
  if (trajStatus) return;
  const start = performance.now();
  const step = (now) => {
    const tNow = (now - start) / 1000 * trajSpeed;
    if (tNow < 0.7) { drawTraj(tNow); anim = requestAnimationFrame(step); }
    else { anim = null; drawTraj(); }
  };
  anim = requestAnimationFrame(step);
}

/* 선택된 투구로 구종별 평균 궤적 파라미터를 구한다. */
function typeMeans(respectHidden) {
  const p = new Float32Array(NP), nt = D.types.length;
  const sums = Array.from({ length: nt }, () => new Float64Array(NP + 1));
  for (const i of sel) {
    const t = T[i];
    if ((respectHidden && state.hidden.has(t)) || !trajParams(i, p)) continue;
    const s = sums[t]; for (let j = 0; j < NP; j++) s[j] += p[j]; s[NP]++;
  }
  return sums.map((s, t) => ({ t, n: s[NP], m: s[NP] ? Array.from(s.slice(0, NP), (v) => v / s[NP]) : null }));
}
function posAt(m, t) { return [m[0] + m[2] * t + m[5] * t * t / 2, m[8] + m[3] * t + m[6] * t * t / 2, m[1] + m[4] * t + m[7] * t * t / 2]; }

function tAtY(p, y) {
  const a = p[6] / 2, b = p[3], c = p[8] - y, disc = b * b - 4 * a * c;
  if (disc < 0 || a === 0) return null;
  return (-b - Math.sqrt(disc)) / (2 * a);
}
function pathOf(p, steps, tNow = Infinity) {
  const t0 = tAtY(p, Y_RELEASE), t1 = tAtY(p, Y_PLATE);
  if (t0 == null || t1 == null) return null;
  const tEnd = Math.min(t1, t0 + tNow), pts = [];
  for (let k = 0; k <= steps; k++) {
    const t = t0 + (tEnd - t0) * k / steps;
    pts.push(posAt(p, t));
  }
  return pts;
}
function projector(view, w, h) {
  const pad = 30;
  if (view === "catcher") {
    // 홈플레이트 뒤 20ft, 릴리스와 비슷한 높이(4.6ft)에 카메라를 둔 원근 투영 (Statcast 포수 시점과 비슷한 구도)
    const camY = -20, camZ = 4.6, d0 = Y_PLATE - camY, f = Math.min(w * 0.5 * d0 / 2.8, h * 4.2);
    return ([x, y, z]) => { const d = y - camY; return [w / 2 + f * x / d, h * 0.22 - f * (z - camZ) / d]; };
  }
  const sx = (y) => pad + (Y_RUBBER + 1 - y) / (Y_RUBBER + 1) * (w - pad * 2);
  if (view === "side") return ([x, y, z]) => [sx(y), h - pad - z / 8 * (h - pad * 2)];
  return ([x, y, z]) => [sx(y), h / 2 - x / 3 * (h / 2 - pad)];  // 위에서 본 모습: 위쪽이 1루
}
function trajParams(i, out) {
  const o = i * NP;
  if (!TR || Number.isNaN(TR[o])) return false;
  for (let j = 0; j < NP; j++) out[j] = TR[o + j];
  return true;
}

function drawTraj(tNow = Infinity) {
  if (!trajCtx || !trajW) return;
  const playing = Number.isFinite(tNow);
  const ctx = trajCtx, w = trajW, h = trajH, cs = getComputedStyle(document.documentElement);
  const tok = (n) => cs.getPropertyValue(n).trim();
  const line = tok("--line"), muted = tok("--muted"), ink = tok("--zone"), surface = tok("--surface");
  const font = getComputedStyle(document.body).fontFamily;
  ctx.clearRect(0, 0, w, h);
  const pr = projector(trajView, w, h);
  const poly = (pts, close) => { ctx.beginPath(); pts.forEach((q, k) => { const [a, b] = pr(q); k ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); if (close) ctx.closePath(); };
  const [zb, zt] = D.meta.zone, hw = 17 / 24;
  ctx.font = "11px " + font; ctx.fillStyle = muted; ctx.strokeStyle = line; ctx.lineWidth = 1;

  // 배경: 홈플레이트, 스트라이크존, 투수판
  if (trajView === "catcher") {
    ctx.fillStyle = line;
    poly([[-hw, Y_PLATE, 0], [hw, Y_PLATE, 0], [hw, hw, 0], [0, 0, 0], [-hw, hw, 0]], true); ctx.fill();
    poly([[-1, Y_RUBBER, 0.83], [1, Y_RUBBER, 0.83]]); ctx.lineWidth = 3; ctx.strokeStyle = line; ctx.stroke();
  } else if (trajView === "side") {
    ctx.beginPath(); const [g0, gy] = pr([0, Y_RUBBER + 1, 0]), [g1] = pr([0, 0, 0]); ctx.moveTo(g0, gy); ctx.lineTo(g1, gy); ctx.stroke();
    // 마운드: 투수판 높이 10인치, 앞쪽으로 완만하게 내려감
    ctx.fillStyle = line; poly([[0, Y_RUBBER + 1, 0], [0, Y_RUBBER + 1, 0.83], [0, Y_RUBBER - 0.5, 0.83], [0, Y_RUBBER - 6.5, 0.33], [0, Y_RUBBER - 9, 0]], true); ctx.fill();
    ctx.fillStyle = muted; ctx.textAlign = "center";
    for (let ft = 0; ft <= 60; ft += 10) { const [a] = pr([0, ft, 0]); ctx.fillText(`${ft}ft`, a, gy + 16); }
  } else {
    ctx.beginPath(); const [a0, my] = pr([0, Y_RUBBER + 1, 0]), [a1] = pr([0, 0, 0]); ctx.setLineDash([4, 4]); ctx.moveTo(a0, my); ctx.lineTo(a1, my); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = line; poly([[-hw, Y_PLATE, 0], [hw, Y_PLATE, 0], [hw, hw, 0], [0, 0, 0], [-hw, hw, 0]], true); ctx.fill();
    poly([[-1, Y_RUBBER, 0], [1, Y_RUBBER, 0]]); ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 1;
    ctx.fillStyle = muted; ctx.textAlign = "left"; ctx.fillText("1루 쪽", 8, 16); ctx.fillText("3루 쪽", 8, h - 8);
  }

  if (trajStatus) {
    ctx.fillStyle = muted; ctx.textAlign = "center"; ctx.font = "13px " + font;
    ctx.fillText(trajStatus, w / 2, h / 2);
    return;
  }

  // 데이터: 구종별 평균 궤적 또는 개별 투구
  const p = new Float32Array(NP), nt = D.types.length;
  const sums = Array.from({ length: nt }, () => new Float64Array(NP + 1));
  const each = [];
  for (const i of sel) {
    const t = T[i];
    if (state.hidden.has(t) || !trajParams(i, p)) continue;
    const s = sums[t]; for (let j = 0; j < NP; j++) s[j] += p[j]; s[NP]++;
    each.push(i);
  }
  const shown = each.length, stride = Math.max(1, Math.ceil(shown / (playing ? 40 : 300)));
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (trajMode === "each") {
    ctx.lineWidth = 1; ctx.globalAlpha = shown > 100 ? 0.35 : 0.6;
    for (let k = 0; k < shown; k += stride) {
      const i = each[k]; trajParams(i, p);
      const pts = pathOf(p, 16, tNow); if (!pts) continue;
      ctx.strokeStyle = colors[T[i]]; poly(pts); ctx.stroke();
      if (playing) {
        const [bx, by] = pr(pts[pts.length - 1]);
        ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI * 2); ctx.fillStyle = colors[T[i]]; ctx.fill();
        ctx.globalAlpha = shown > 100 ? 0.35 : 0.6;
      }
    }
    ctx.globalAlpha = 1;
  } else {
    const order = sums.map((s, t) => ({ t, n: s[NP] })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
    for (const { t, n } of order) {
      const m = Array.from(sums[t].slice(0, NP), (v) => v / n);
      const pts = pathOf(m, 32, tNow); if (!pts) continue;
      // 측정 시작 지점(y0) 이전 추정 구간은 점선
      const cut = pts.findIndex((q) => q[1] <= m[8]);
      ctx.strokeStyle = colors[t]; ctx.lineWidth = 3;
      ctx.setLineDash([3, 4]); poly(cut < 0 ? pts : pts.slice(0, cut + 1)); ctx.stroke(); ctx.setLineDash([]);
      if (cut >= 0) { poly(pts.slice(cut)); ctx.stroke(); }
      const [ex, ey] = pr(pts[pts.length - 1]);
      ctx.beginPath(); ctx.arc(ex, ey, playing ? 6 : 5, 0, Math.PI * 2); ctx.fillStyle = colors[t]; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke();
    }
  }

  // 스트라이크존은 궤적 위에
  ctx.strokeStyle = ink; ctx.lineWidth = 1.5;
  if (trajView === "catcher") { poly([[-hw, Y_PLATE, zb], [hw, Y_PLATE, zb], [hw, Y_PLATE, zt], [-hw, Y_PLATE, zt]], true); ctx.stroke(); }
  else if (trajView === "side") { poly([[0, Y_PLATE, zb], [0, Y_PLATE, zt]]); ctx.lineWidth = 3; ctx.stroke(); }
  else { poly([[-hw, Y_PLATE, 0], [hw, Y_PLATE, 0]]); ctx.lineWidth = 3; ctx.stroke(); }
  ctx.fillStyle = muted; ctx.font = "11px " + font; ctx.textAlign = "right";
  const label = (trajMode === "each" ? `${fmt(Math.ceil(shown / stride))}구 표시` : `${fmt(shown)}구 평균`)
    + (playing ? ` · 릴리스 후 ${tNow.toFixed(3)}초` : "");
  ctx.fillText(label, w - 8, 16);
  if (trajView === "side") { ctx.textAlign = "left"; ctx.fillText("투수판", 6, 16); }
}

/* ---------- 터널링 ---------- */
// 두 구종의 평균 궤적을 '홈 도착 전 같은 시간'에 맞춰 비교한다 (Baseball Prospectus의 터널링 방식).
function tunnelStats(a, b) {
  const ta = tAtY(a, Y_PLATE), tb = tAtY(b, Y_PLATE);
  const ra = tAtY(a, Y_RELEASE), rb = tAtY(b, Y_RELEASE);
  const gap = (pa, pb) => Math.hypot(pa[0] - pb[0], pa[2] - pb[2]) * 30.48;  // 포수 시점 평면 거리(cm)
  const at = (tau) => gap(posAt(a, ta - tau), posAt(b, tb - tau));
  const flight = Math.min(ta - ra, tb - rb);
  const curve = [];
  for (let k = 0; k <= 40; k++) { const tau = flight * (1 - k / 40); curve.push([tau, at(tau)]); }
  const release = gap(posAt(a, ra), posAt(b, rb)), decision = at(DECISION), plate = at(0);
  return { release, decision, plate, ratio: decision > 0 ? plate / decision : 0, curve, flight };
}

function fillTunnelBase(means) {
  const present = means.filter((x) => x.n >= 10).sort((p, q) => q.n - p.n);
  const ok = present.some((x) => x.t === tunBase);
  if (!ok) tunBase = present.length ? present[0].t : null;
  $("tun-base").innerHTML = present.map((x) => `<option value="${x.t}">${esc(D.types[x.t])} (${fmt(x.n)}구)</option>`).join("") || `<option>–</option>`;
  if (tunBase != null) $("tun-base").value = String(tunBase);
  return present;
}

function drawTunnel() {
  if (!tunCtx || !tunW || !sepCtx || !sepW || !D) return;
  const cs = getComputedStyle(document.documentElement), tok = (n) => cs.getPropertyValue(n).trim();
  const line = tok("--line"), muted = tok("--muted"), ink = tok("--zone"), surface = tok("--surface"), accent = tok("--accent");
  const font = getComputedStyle(document.body).fontFamily;
  for (const [c, w, h] of [[tunCtx, tunW, tunH], [sepCtx, sepW, sepH]]) c.clearRect(0, 0, w, h);
  const msg = (text) => {
    for (const [c, w, h] of [[tunCtx, tunW, tunH], [sepCtx, sepW, sepH]]) { c.fillStyle = muted; c.font = "13px " + font; c.textAlign = "center"; c.fillText(text, w / 2, h / 2); }
    $("tuntable").innerHTML = "";
  };
  if (trajStatus) return msg(trajStatus);
  const means = typeMeans(false);
  const present = fillTunnelBase(means);
  if (tunBase == null || present.length < 2) return msg("비교하려면 10구 이상 던진 구종이 2개 이상 필요합니다.");
  const base = means[tunBase];
  const rows = present.filter((x) => x.t !== tunBase).map((x) => ({ t: x.t, n: x.n, ...tunnelStats(base.m, x.m) }));
  if (!rows.some((r) => r.t === tunComp)) tunComp = rows[0].t;
  const comp = means[tunComp], cur = rows.find((r) => r.t === tunComp);

  // 표
  $("tuntable").innerHTML = `<thead><tr><th>비교 구종</th><th>투구 수</th><th>릴리스 차이</th><th>판단 시점 차이</th><th>홈 도착 차이</th><th>갈라짐 배율</th></tr></thead><tbody>` +
    rows.map((r) => `<tr data-t="${r.t}" aria-selected="${r.t === tunComp}"><td><span class="tname"><i style="background:${colors[r.t]}"></i>${esc(D.types[r.t])}</span></td><td>${fmt(r.n)}</td><td>${r.release.toFixed(1)}cm</td><td>${r.decision.toFixed(1)}cm</td><td>${r.plate.toFixed(1)}cm</td><td>${r.ratio.toFixed(1)}배</td></tr>`).join("") + "</tbody>";

  // 왼쪽: 포수 시점에 두 궤적 + 판단 시점·홈 도착 위치
  {
    const ctx = tunCtx, w = tunW, h = tunH, pr = projector("catcher", w, h);
    const poly = (pts) => { ctx.beginPath(); pts.forEach((q, k) => { const [a, b] = pr(q); k ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); };
    const [zb, zt] = D.meta.zone, hw = 17 / 24;
    ctx.lineCap = "round";
    for (const x of [base, comp]) {
      const pts = pathOf(x.m, 40); if (!pts) continue;
      ctx.strokeStyle = colors[x.t]; ctx.lineWidth = 3; poly(pts); ctx.stroke();
    }
    ctx.strokeStyle = ink; ctx.lineWidth = 1.5; poly([[-hw, Y_PLATE, zb], [hw, Y_PLATE, zb], [hw, Y_PLATE, zt], [-hw, Y_PLATE, zt], [-hw, Y_PLATE, zb]]); ctx.stroke();
    const mark = (tau, label) => {
      const pa = posAt(base.m, tAtY(base.m, Y_PLATE) - tau), pb = posAt(comp.m, tAtY(comp.m, Y_PLATE) - tau);
      const [ax, ay] = pr(pa), [bx, by] = pr(pb);
      ctx.strokeStyle = muted; ctx.lineWidth = 1; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.setLineDash([]);
      for (const [x, y, c] of [[ax, ay, colors[base.t]], [bx, by, colors[comp.t]]]) { ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke(); }
      ctx.fillStyle = muted; ctx.font = "11px " + font; ctx.textAlign = "left"; ctx.fillText(label, Math.max(ax, bx) + 9, (ay + by) / 2 + 4);
    };
    mark(DECISION, `판단 시점 ${cur.decision.toFixed(0)}cm`);
    mark(0, `홈 도착 ${cur.plate.toFixed(0)}cm`);
    ctx.font = "600 12px " + font; ctx.textAlign = "left";
    ctx.fillStyle = colors[base.t]; ctx.fillText("● " + D.types[base.t], 8, 18);
    ctx.fillStyle = colors[comp.t]; ctx.fillText("● " + D.types[comp.t], 8, 36);
  }

  // 오른쪽: 홈 도착 전 시간에 따른 거리
  {
    const ctx = sepCtx, w = sepW, h = sepH, padL = 44, padR = 16, padT = 16, padB = 34;
    const tMax = Math.max(...rows.map((r) => r.flight)), yMax = Math.max(40, Math.ceil(Math.max(...rows.map((r) => r.plate)) / 20) * 20);
    const X = (tau) => padL + (tMax - tau) / tMax * (w - padL - padR);
    const Y = (v) => h - padB - v / yMax * (h - padT - padB);
    ctx.font = "11px " + font; ctx.fillStyle = muted; ctx.strokeStyle = line; ctx.lineWidth = 1;
    ctx.textAlign = "right";
    for (let v = 0; v <= yMax; v += yMax > 80 ? 40 : 20) { ctx.globalAlpha = v ? 0.6 : 1; ctx.beginPath(); ctx.moveTo(padL, Y(v)); ctx.lineTo(w - padR, Y(v)); ctx.stroke(); ctx.globalAlpha = 1; ctx.fillText(`${v}cm`, padL - 6, Y(v) + 4); }
    ctx.textAlign = "center";
    for (let tau = 0; tau <= tMax + 1e-9; tau += 0.1) ctx.fillText(tau ? `${tau.toFixed(1)}초 전` : "홈 도착", X(tau), h - padB + 16);
    // 판단 시점
    ctx.strokeStyle = accent; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(X(DECISION), padT); ctx.lineTo(X(DECISION), h - padB); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = accent; ctx.textAlign = "right"; ctx.fillText("타자 판단 시점", X(DECISION) - 6, padT + 10);
    // 구종별 선: 선택한 비교 구종을 진하게
    const ordered = [...rows].sort((a, b) => (a.t === tunComp) - (b.t === tunComp));
    for (const r of ordered) {
      const active = r.t === tunComp;
      ctx.globalAlpha = active ? 1 : 0.35; ctx.strokeStyle = colors[r.t]; ctx.lineWidth = active ? 3 : 2; ctx.lineJoin = "round";
      ctx.beginPath(); r.curve.forEach(([tau, v], k) => k ? ctx.lineTo(X(tau), Y(v)) : ctx.moveTo(X(tau), Y(v))); ctx.stroke();
      ctx.globalAlpha = 1;
      if (active) {
        for (const [tau, v] of [[DECISION, r.decision], [0, r.plate]]) { ctx.beginPath(); ctx.arc(X(tau), Y(v), 4.5, 0, Math.PI * 2); ctx.fillStyle = colors[r.t]; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke(); }
      }
    }
    ctx.fillStyle = muted; ctx.textAlign = "left"; ctx.fillText(`${D.types[tunBase]} 기준 거리`, padL + 4, padT + 10);
  }
}

/* ---------- 무브먼트 ---------- */
const MXR = [-70, 70], MZR = [-60, 70], MOVE_PAD = 34;
function drawMove() {
  if (!moveCtx || !moveW) return;
  const ctx = moveCtx, w = moveW, h = moveH, cs = getComputedStyle(document.documentElement);
  const tok = (n) => cs.getPropertyValue(n).trim();
  const line = tok("--line"), muted = tok("--muted"), surface = tok("--surface"), ink = tok("--ink");
  const font = getComputedStyle(document.body).fontFamily;
  const pad = MOVE_PAD;
  const mx = (v) => pad + (v - MXR[0]) / (MXR[1] - MXR[0]) * (w - pad * 2);
  const mz = (v) => h - pad - (v - MZR[0]) / (MZR[1] - MZR[0]) * (h - pad * 2);
  ctx.clearRect(0, 0, w, h);
  ctx.font = "11px " + font; ctx.lineWidth = 1; ctx.strokeStyle = line; ctx.fillStyle = muted;
  // 20cm 격자
  ctx.textAlign = "center";
  for (let v = -60; v <= 60; v += 20) { ctx.globalAlpha = v ? 0.5 : 1; ctx.beginPath(); ctx.moveTo(mx(v), mz(MZR[0])); ctx.lineTo(mx(v), mz(MZR[1])); ctx.stroke(); ctx.globalAlpha = 1; ctx.fillText(v, mx(v), h - pad + 14); }
  ctx.textAlign = "right";
  for (let v = -60; v <= 60; v += 20) { ctx.globalAlpha = v ? 0.5 : 1; ctx.beginPath(); ctx.moveTo(mx(MXR[0]), mz(v)); ctx.lineTo(mx(MXR[1]), mz(v)); ctx.stroke(); ctx.globalAlpha = 1; ctx.fillText(v, pad - 4, mz(v) + 4); }
  // 방향 안내: 투수가 정해지면 팔 쪽/글러브 쪽
  const pit = state.pitcher === "all" ? null : D.pitchers[+state.pitcher];
  const left = pit && pit[2] ? (pit[2] === "R" ? "← 팔 쪽 (3루)" : "← 글러브 쪽 (3루)") : "← 3루 쪽";
  const right = pit && pit[2] ? (pit[2] === "R" ? "글러브 쪽 (1루) →" : "팔 쪽 (1루) →") : "1루 쪽 →";
  ctx.textAlign = "left"; ctx.fillText(left, pad + 4, pad - 10);
  ctx.textAlign = "right"; ctx.fillText(right, w - pad - 4, pad - 10);
  ctx.textAlign = "left";
  ctx.fillText("↑ 덜 떨어짐", mx(MXR[0]) + 6, mz(MZR[1]) + 14);
  ctx.fillText("↓ 더 떨어짐", mx(MXR[0]) + 6, mz(MZR[0]) - 6);

  const nt = D.types.length, sums = Array.from({ length: nt }, () => [0, 0, 0, 0, 0]);
  const pts = [];
  for (const i of sel) {
    if (MX[i] === -32768 || state.hidden.has(T[i])) continue;
    pts.push(i);
    const s = sums[T[i]]; s[0] += MX[i]; s[1] += MZ[i]; s[2]++; if (V[i]) { s[3] += V[i]; s[4]++; }
  }
  const r = pts.length > 20000 ? 1.4 : pts.length > 3000 ? 2 : 3;
  ctx.globalAlpha = pts.length > 20000 ? 0.12 : pts.length > 3000 ? 0.3 : 0.55;
  for (const i of pts) { ctx.beginPath(); ctx.arc(mx(MX[i]), mz(MZ[i]), r, 0, Math.PI * 2); ctx.fillStyle = colors[T[i]]; ctx.fill(); }
  ctx.globalAlpha = 1;
  moveMeans = sums.map((s, t) => ({ t, n: s[2], h: s[0] / s[2], v: s[1] / s[2], kmh: s[4] ? s[3] / s[4] : 0 })).filter((m) => m.n > 0).sort((a, b) => b.n - a.n);
  for (const m of moveMeans) {
    const x = mx(m.h), y = mz(m.v);
    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fillStyle = colors[m.t]; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke();
    ctx.fillStyle = ink; ctx.textAlign = "left"; ctx.font = "600 12px " + font;
    ctx.fillText(D.types[m.t], x + 10, y + 4); ctx.font = "11px " + font;
  }
  $("movetable").innerHTML = `<thead><tr><th>구종</th><th>투구 수</th><th>평균 구속</th><th>수평 cm</th><th>수직 cm</th></tr></thead><tbody>` +
    (moveMeans.length ? moveMeans.map((m) => `<tr><td><span class="tname"><i style="background:${colors[m.t]}"></i>${esc(D.types[m.t])}</span></td><td>${fmt(m.n)}</td><td>${m.kmh ? m.kmh.toFixed(1) : "–"}</td><td>${m.h.toFixed(1)}</td><td>${m.v.toFixed(1)}</td></tr>`).join("")
      : `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:16px">표시할 투구가 없습니다.</td></tr>`) + "</tbody>";
}
function moveHover(e) {
  const rect = e.currentTarget.getBoundingClientRect(), x = e.clientX - rect.left, y = e.clientY - rect.top, pad = MOVE_PAD;
  const mx = (v) => pad + (v - MXR[0]) / (MXR[1] - MXR[0]) * (moveW - pad * 2);
  const mz = (v) => moveH - pad - (v - MZR[0]) / (MZR[1] - MZR[0]) * (moveH - pad * 2);
  let best = null, bd = 196;
  for (const m of moveMeans) { const d = (mx(m.h) - x) ** 2 + (mz(m.v) - y) ** 2; if (d < bd) { bd = d; best = m; } }
  if (!best) return hideTip();
  showTip(e.clientX, e.clientY, `<b>${esc(D.types[best.t])}</b> 평균 · ${fmt(best.n)}구<br><span class="m">수평 ${best.h.toFixed(1)}cm · 수직 ${best.v.toFixed(1)}cm<br>${best.kmh.toFixed(1)}km/h</span>`);
}

const ZNAME = ["존 위·3루쪽", "존 위·가운데", "존 위·1루쪽", "존 가운데·3루쪽", "한가운데", "존 가운데·1루쪽", "존 아래·3루쪽", "존 아래·가운데", "존 아래·1루쪽", "바깥 위·3루쪽", "바깥 위·1루쪽", "바깥 아래·3루쪽", "바깥 아래·1루쪽"];
let PM = null;  // web/predict.js 모델 (탭을 처음 열 때 만든다)
const pq = { pitcher: null, batter: -1, stance: 0, balls: 0, strikes: 0, prev: -1, ztype: "all" };
const ZONE_CELLS = (() => {

  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {

  }
  cells.push({ pts: "10,10 100,10 100,50 50,50 50,100 10,100", cx: 30, cy: 34 });
  cells.push({ pts: "100,10 190,10 190,100 150,100 150,50 100,50", cx: 170, cy: 34 });
  cells.push({ pts: "10,100 50,100 50,150 100,150 100,190 10,190", cx: 30, cy: 174 });
  cells.push({ pts: "150,100 190,100 190,190 100,190 100,150 150,150", cx: 170, cy: 174 });
  return cells;
})();

function ensurePredictModel() {
  if (PM) return PM;
  const c = D.cols;
  PM = BallPredict.create({ N, P, B, T, S, PV: c.pv, ZN: c.zn, RV: c.rv, hands: D.pitchers.map((p) => p[2]), nTypes: D.types.length, model: D.model });
  return PM;
}

function setupPredict() {
  $("pq-count").innerHTML = `<span></span>${[0, 1, 2].map((s) => `<span class="hd">${s}S</span>`).join("")}` +
    [0, 1, 2, 3].map((b) => `<span class="hd">${b}B</span>` + [0, 1, 2].map((s) => `<button type="button" data-b="${b}" data-s="${s}" aria-pressed="false">${b}-${s}</button>`).join("")).join("");
  $("pq-count").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    pq.balls = +b.dataset.b; pq.strikes = +b.dataset.s;
    if (pq.balls === 0 && pq.strikes === 0) pq.prev = -1;
    renderPredict();
  });
  $("pq-stance").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { pq.stance = +b.dataset.v; renderPredict(); } });
  $("pq-prev").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b && !b.disabled) { pq.prev = +b.dataset.t; renderPredict(); } });
  $("pq-ztype").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { pq.ztype = b.dataset.t; renderPredict(); } });
  $("pq-batter").addEventListener("change", (e) => {
    pq.batter = +e.target.value;
    if (pq.batter >= 0) pq.stance = batterStance(pq.batter);
    renderPredict();
  });
}

// 그 타자가 가장 많이 선 타석 (스위치 타자는 투수 손 반대쪽)
function batterStance(b, pitcher = pq.pitcher) {
  let l = 0, r = 0;
  const hand = pitcher != null && D.pitchers[pitcher][2] === "L" ? 1 : 0;
  for (let i = 0; i < N; i++) if (B[i] === b) { lefty(S[i]) ? l++ : r++; }
  if (l && r && Math.min(l, r) / (l + r) > 0.2) return hand ? 0 : 1;
  return l > r ? 1 : 0;
}

function batterOptions(pitcher, noneLabel) {
  const faced = new Map();
  for (let i = 0; i < N; i++) if (P[i] === pitcher && R[i] >= 0 && (R[i] & 1)) faced.set(B[i], (faced.get(B[i]) || 0) + 1);
  const mine = [...faced].sort((a, b) => b[1] - a[1]);
  const others = D.batters.map((b, i) => [i, b]).filter(([i]) => !faced.has(i)).sort((a, b) => a[1][0].localeCompare(b[1][0], "ko"));
  return `<option value="-1">${noneLabel}</option>` +
    (mine.length ? `<optgroup label="이 투수와 상대한 타자">${mine.map(([i, n]) => `<option value="${i}">${esc(D.batters[i][0])} · ${esc(D.teams[D.batters[i][1]])} (${n}타석)</option>`).join("")}</optgroup>` : "") +
    `<optgroup label="그 밖의 타자">${others.map(([i, b]) => `<option value="${i}">${esc(b[0])} · ${esc(D.teams[b[1]])}</option>`).join("")}</optgroup>`;
}
function fillBatters() {
  $("pq-batter").innerHTML = batterOptions(pq.pitcher, "지정 안 함 (타자 보정 없이)");
  $("pq-batter").value = String(pq.batter);
}
// 이 투수가 1% 이상 던진 구종, 많이 던진 순
function arsenalOf(pitcher) {
  const used = new Float64Array(D.types.length);
  for (let i = 0; i < N; i++) if (P[i] === pitcher) used[T[i]]++;
  const total = used.reduce((a, v) => a + v, 0);
  return [...used].map((n, t) => ({ t, n })).filter((x) => x.n / total >= 0.01).sort((a, b) => b.n - a.n);
}

function renderPredict() {
  if (!$("pred-root") || $("predict").hidden) return;
  const root = $("pq-result");
  if (state.pitcher === "all") {
    for (const id of ["pq-result", "pq-value", "pq-znotes"]) $(id).innerHTML = "";
    $("pq-zone").innerHTML = ""; $("pq-ztype").innerHTML = ""; $("pq-prev").innerHTML = "";
    $("pset-who").textContent = "";
    root.innerHTML = `<div class="empty-state">위 검색창에서 투수를 한 명 고르면 다음 공을 예측합니다.</div>`;
    return;
  }
  const m = ensurePredictModel();
  const pitcher = +state.pitcher;
  if (pq.pitcher !== pitcher) { pq.pitcher = pitcher; pq.batter = -1; pq.prev = -1; pq.ztype = "all"; fillBatters(); }
  const pinfo = D.pitchers[pitcher];
  $("pset-who").innerHTML = `투수 <b style="color:var(--ink)">${esc(pinfo[0])}</b> · ${esc(D.teams[pinfo[1]])} · ${pinfo[2] === "L" ? "좌투" : "우투"} <span style="color:var(--faint)">(바꾸려면 위 검색창)</span>`;
  for (const b of $("pq-count").querySelectorAll("button")) b.setAttribute("aria-pressed", String(+b.dataset.b === pq.balls && +b.dataset.s === pq.strikes));
  for (const b of $("pq-stance").querySelectorAll("button")) b.setAttribute("aria-pressed", String(+b.dataset.v === pq.stance));

  // 이 투수가 던진 구종 (직전 공 칩, 결과 정렬에 씀)
  const used = new Float64Array(D.types.length);
  for (let i = 0; i < N; i++) if (P[i] === pitcher) used[T[i]]++;
  const total = used.reduce((a, v) => a + v, 0);
  const arsenal = [...used].map((n, t) => ({ t, n })).filter((x) => x.n / total >= 0.01).sort((a, b) => b.n - a.n);
  const first = pq.balls === 0 && pq.strikes === 0;
  $("pq-prev").innerHTML = `<button type="button" class="chip" data-t="-1" aria-pressed="${pq.prev === -1}">${first ? "초구 (직전 공 없음)" : "모름 / 상관없음"}</button>` +
    arsenal.map((x) => `<button type="button" class="chip" data-t="${x.t}" aria-pressed="${pq.prev === x.t}" ${first ? "disabled" : ""}><span class="dot" style="background:${colors[x.t]}"></span>${esc(D.types[x.t])}</button>`).join("");

  const q = { pitcher, batter: pq.batter, stance: pq.stance, balls: pq.balls, strikes: pq.strikes, prev: pq.prev };
  const res = m.typeProbs(q);
  const order = res.probs.map((p, t) => ({ t, p })).filter((x) => x.p >= 0.005 || used[x.t] > 0).sort((a, b) => b.p - a.p);
  const top = order[0];
  const ev = res.evidence, cnt = `${pq.balls}-${pq.strikes}`;
  const ev_steps = [`이 투수 <b>${fmt(ev[0])}</b>구`, `${cnt} 카운트 <b>${fmt(ev[1])}</b>구`, `${pq.stance ? "좌타" : "우타"} 상대 <b>${fmt(ev[2])}</b>구`];
  if (pq.prev >= 0) ev_steps.push(`직전 ${esc(D.types[pq.prev])} <b>${fmt(ev[3])}</b>구`);
  else if (!first) ev_steps.push(`직전 공 무관`);
  const evalT = D.model.eval.type;
  const prevBars = new Map([...root.querySelectorAll(".pbar")].map((el) => [el.dataset.t, el.querySelector(".fill").style.width]));
  root.innerHTML = `<div class="pred-top"><span class="big"><i style="background:${colors[top.t]}"></i>${esc(D.types[top.t])}</span><span class="pv">${(top.p * 100).toFixed(0)}%</span>
      <span style="color:var(--muted);font-size:13px">2순위 ${esc(D.types[order[1].t])} ${(order[1].p * 100).toFixed(0)}% · 둘 중 하나일 확률 ${((top.p + order[1].p) * 100).toFixed(0)}%</span></div>
    <div class="pbars">${order.map((x) => `<div class="pbar" data-t="${x.t}"><span class="nm"><i style="background:${colors[x.t]}"></i>${esc(D.types[x.t])}</span>
      <div class="track"><div class="fill" style="background:${colors[x.t]};width:${prevBars.get(String(x.t)) || "0%"}"></div></div><span class="v">${(x.p * 100).toFixed(1)}%</span></div>`).join("")}</div>
    <div class="evidence">근거: ${ev_steps.join(' <span class="arr">→</span> ')}${res.batterAdjusted ? ` · <b>${esc(D.batters[pq.batter][0])}</b> 상대 보정` : ""}
      <span style="margin-left:auto">검증 정답률 ${(evalT.acc * 100).toFixed(1)}% · 상위 2개 ${(evalT.top2 * 100).toFixed(1)}%</span></div>`;
  requestAnimationFrame(() => root.querySelectorAll(".pbar").forEach((el) => {
    const x = order.find((o) => String(o.t) === el.dataset.t);
    el.querySelector(".fill").style.width = (x.p / top.p * 100).toFixed(1) + "%";
  }));

  // 코스
  const zTypes = order.slice(0, 5);
  if (pq.ztype !== "all" && !zTypes.some((x) => String(x.t) === pq.ztype)) pq.ztype = "all";
  $("pq-ztype").innerHTML = `<button type="button" class="chip" data-t="all" aria-pressed="${pq.ztype === "all"}">전체 (구종 확률로 합산)</button>` +
    zTypes.map((x) => `<button type="button" class="chip" data-t="${x.t}" aria-pressed="${pq.ztype === String(x.t)}"><span class="dot" style="background:${colors[x.t]}"></span>${esc(D.types[x.t])}</button>`).join("");
  let zp = new Array(BallPredict.N_ZONES).fill(0), zN = 0;
  if (pq.ztype === "all") {
    for (const x of order) { const z = m.zoneProbs(q, x.t); z.probs.forEach((v, k) => { zp[k] += v * x.p; }); zN += z.n; }
  } else { const z = m.zoneProbs(q, +pq.ztype); zp = z.probs; zN = z.n; }
  drawZoneMap(zp);
  const inZone = zp.slice(0, 9).reduce((a, v) => a + v, 0);
  const best = zp.map((v, k) => ({ k, v })).sort((a, b) => b.v - a.v)[0];
  const lowOut = zp[11] + zp[12] + zp[6] + zp[7] + zp[8];
  $("pq-znotes").innerHTML = `<div>스트라이크존 안으로 올 확률 <b>${(inZone * 100).toFixed(0)}%</b></div>
    <div>가장 많은 곳: <b>${ZNAME[best.k]}</b> (${(best.v * 100).toFixed(0)}%)</div>
    <div>낮은 쪽(존 아래 칸 + 바깥 아래) <b>${(lowOut * 100).toFixed(0)}%</b></div>
    <div style="color:var(--faint);font-size:12px">이 투수의 해당 구종·타석 기록 ${fmt(zN)}구에 리그의 카운트별 경향을 더했습니다. 코스는 공마다 많이 흩어져서 대략적인 방향으로 보세요.</div>`;

  // 투수 입장: 구종별 가치
  const vals = m.typeValues(q).filter((v) => used[v.type] > 0);
  const prob = new Map(order.map((x) => [x.t, x.p]));
  const rows = vals.map((v) => ({ ...v, save: -v.value * 100, use: prob.get(v.type) || 0 })).sort((a, b) => b.use - a.use);
  const cand = rows.filter((r) => r.use >= 0.05 && r.nTotal >= 30);
  const bestV = cand.length ? cand.reduce((a, b) => (b.save > a.save ? b : a)) : null;
  const maxAbs = Math.max(0.5, ...rows.map((r) => Math.abs(r.save)));
  $("pq-value").innerHTML = `<thead><tr><th>구종</th><th>예상 사용률</th><th>100구당 막은 실점</th><th>${cnt} 기록</th><th>${pq.stance ? "좌타" : "우타"} 상대</th></tr></thead><tbody>` +
    rows.map((r) => `<tr><td><span class="tname"><i style="background:${colors[r.type]}"></i>${esc(D.types[r.type])}</span>${bestV && r.type === bestV.type ? '<span class="tag">가장 잘 통함</span>' : ""}</td>
      <td>${(r.use * 100).toFixed(1)}%</td>
      <td>${r.save >= 0 ? "+" : ""}${r.save.toFixed(2)}<span class="vbar" style="width:${Math.abs(r.save) / maxAbs * 60}px;background:${r.save >= 0 ? "var(--pt-ch)" : "var(--accent)"}"></span></td>
      <td>${fmt(r.n)}구</td><td>${fmt(r.nStance)}구</td></tr>`).join("") + "</tbody>";
}

function drawZoneMap(zp) {
  const cs = getComputedStyle(document.documentElement);
  const accent = cs.getPropertyValue("--accent").trim(), line = cs.getPropertyValue("--line").trim(), ink = cs.getPropertyValue("--ink").trim(), zone = cs.getPropertyValue("--zone").trim();
  const max = Math.max(...zp);
  const svg = $("pq-zone");
  if (!svg.children.length) {
    svg.innerHTML = ZONE_CELLS.map((c, k) => `<polygon class="cell" data-k="${k}" points="${c.pts}" fill-opacity="0"/><text data-k="${k}" x="${c.cx}" y="${c.cy}" text-anchor="middle"></text>`).join("") +
      `<rect x="50" y="50" width="100" height="100" fill="none" stroke-width="2" id="pq-zone-box"/>`;
  }
  svg.querySelectorAll("polygon").forEach((el) => {
    const v = zp[+el.dataset.k], a = max ? v / max : 0;
    el.setAttribute("fill", accent); el.setAttribute("stroke", line); el.setAttribute("stroke-width", "1");
    el.setAttribute("fill-opacity", (0.06 + 0.86 * a).toFixed(3));
  });
  svg.querySelectorAll("text").forEach((el) => {
    const v = zp[+el.dataset.k];
    el.textContent = (v * 100).toFixed(0) + "%";
    el.setAttribute("fill", v / max > 0.55 ? "#fff" : ink);
  });
  $("pq-zone-box").setAttribute("stroke", zone);
}
